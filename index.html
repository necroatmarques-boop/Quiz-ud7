{q:"¿Qué es una sala blanca, cuarto limpio o sala limpia?",a:"Una sala especialmente diseñada para obtener bajos niveles de contaminación.",i:["Una sala diseñada exclusivamente para mantener una temperatura y humedad constantes.","Una instalación destinada únicamente a eliminar microorganismos mediante productos químicos.","Una sala destinada al almacenamiento de materiales estériles sin controlar las condiciones ambientales."]},
{q:"¿Cuáles son los principales parámetros que se controlan en una sala blanca?",a:"La iluminación, los acabados interiores, las partículas en el aire, las temperaturas, el flujo y la presión del aire, la protección contra incendios y la protección electrostática.",i:["La iluminación, la humedad y la temperatura, sin controlar el flujo ni la presión del aire.","La concentración de oxígeno, la composición química de las paredes y la velocidad de producción.","La temperatura seca, la humedad y la iluminación, sin controlar las partículas ni la protección electrostática."]},
{q:"¿Cuál es una de las principales desventajas de las salas blancas?",a:"Su elevado coste de implementación y funcionamiento.",i:["La imposibilidad de controlar la contaminación por partículas.","La necesidad de mantener una presión inferior a la del exterior.","La limitación de su uso a instalaciones destinadas exclusivamente a productos farmacéuticos."]},
{q:"¿Por qué es necesario utilizar salas blancas en la fabricación de aleaciones equiatómicas y semiconductores?",a:"Porque las propiedades deseadas de estos materiales dependen del control que se tenga durante su fabricación.",i:["Porque estos materiales necesitan una humedad elevada para conservar sus propiedades.","Porque permiten fabricar estos materiales sin controlar las partículas presentes en el ambiente.","Porque estos materiales solo pueden procesarse a temperaturas inferiores a la temperatura ambiente."]},
{q:"¿Qué tratamiento recibe el aire que entra en una sala blanca y con qué frecuencia se renueva?",a:"Se filtra para eliminar partículas en suspensión y microorganismos, y se renueva completamente varias veces por hora.",i:["Se filtra únicamente para eliminar microorganismos y se renueva una vez al día.","Se calienta para eliminar las partículas y se renueva solo cuando se abren las puertas.","Se filtra para eliminar partículas, pero se mantiene sin renovar para conservar la presión interior."]},
{q:"¿Por qué se mantiene una presión interior ligeramente superior a la presión exterior?",a:"Para que, al abrirse las puertas, el aire salga e impida la entrada de aire exterior potencialmente contaminado.",i:["Para favorecer la entrada de aire exterior y aumentar la renovación del ambiente.","Para evitar que el aire filtrado salga de la sala y mantener todas las partículas en su interior.","Para reducir la necesidad de filtrar el aire que entra desde el exterior."]},
{q:"¿Qué características tienen las paredes, los rincones y las juntas de una sala blanca para evitar la acumulación de suciedad?",a:"Las paredes están recubiertas de vinilo, los rincones son redondeados, las juntas están siliconadas y los paneles tienen acabados lisos.",i:["Las paredes tienen superficies rugosas, los rincones son angulosos y las juntas permanecen abiertas para facilitar la ventilación.","Las paredes están recubiertas de materiales absorbentes, los rincones son redondeados y las juntas carecen de sellado.","Las paredes tienen revestimientos metálicos perforados, los rincones son angulosos y los paneles presentan superficies rugosas."]},
{q:"¿Por qué solo hay fregadero en la sala de validación?",a:"Para evitar la entrada de microorganismos en la zona de producción.",i:["Para mantener una presión superior en la sala de validación respecto a la zona de producción.","Para impedir que el agua interfiera en el funcionamiento de los filtros HEPA.","Para concentrar la limpieza del aire en la sala de validación y reducir la renovación en producción."]},
{q:"¿Por qué los operarios deben utilizar trajes especiales en las salas blancas?",a:"Para evitar introducir contaminantes y generar partículas de polvo.",i:["Para mantener constante la temperatura y la humedad de la sala.","Para impedir que la presión interior disminuya al abrirse las puertas.","Para sustituir la necesidad de filtrar y renovar el aire de la instalación."]},
{q:"¿Qué función cumplen las esclusas en las salas blancas?",a:"Mantener las diferencias de presión entre las salas y aislarlas del exterior.",i:["Eliminar directamente los microorganismos presentes en el aire mediante radiación.","Regular exclusivamente la temperatura y la humedad de las salas.","Permitir la entrada directa de aire exterior para equilibrar las presiones."]},
{q:"¿Qué función desempeñan los filtros HEPA en las salas blancas?",a:"Retener partículas presentes en el aire.",i:["Regular las diferencias de presión entre las distintas salas.","Mantener constante la temperatura del aire y controlar su humedad.","Eliminar exclusivamente los gases tóxicos presentes en el ambiente."]},
{q:"¿Qué tipos de flujo de aire se pueden distinguir en una sala limpia?",a:"Flujo turbulento o multidireccional y flujo laminar o unidireccional.",i:["Flujo ascendente y descendente exclusivamente.","Flujo abierto y cerrado, según la velocidad del aire.","Flujo de presión positiva y flujo de presión negativa."]},
{q:"¿Cómo se consigue el grado de pureza en un sistema de flujo de aire turbulento o multidireccional?",a:"Diluyendo la contaminación mediante la aportación de aire limpio.",i:["Impidiendo cualquier movimiento del aire dentro de la sala.","Dirigiendo todo el aire en una única dirección sin mezclarlo con el aire existente.","Aumentando la presión negativa para impedir que las partículas lleguen a los filtros."]},
{q:"¿Cómo funciona el flujo de aire turbulento para retirar las partículas del ambiente?",a:"Mantiene el aire en movimiento constante en distintas direcciones, arrastra las partículas hacia el piso y las conduce a los filtros.",i:["Mantiene el aire inmóvil y deposita las partículas directamente sobre las paredes.","Dirige el aire en una única dirección uniforme y elimina las partículas antes de que se dispersen.","Impulsa las partículas hacia el techo, donde quedan retenidas sin necesidad de filtros."]},
{q:"¿Qué caracteriza al flujo de aire laminar o unidireccional y en qué direcciones puede circular?",a:"Atraviesa la sala de forma uniforme y puede circular en dirección vertical, horizontal o inclinada.",i:["Se mueve en múltiples direcciones y elimina la contaminación mediante la dilución del aire.","Permanece inmóvil y puede circular únicamente en dirección vertical.","Circula de forma irregular y cambia de dirección según la presión exterior."]},
{q:"¿Qué porcentaje del área de los techos de los cuartos limpios se utiliza típicamente para los sistemas de flujo de aire laminar o unidireccional?",a:"El 80 % del área de los techos.",i:["El 20 % del área de los techos.","El 50 % del área de los techos.","El 100 % del área de los techos."]},
{q:"¿Qué materiales se utilizan para construir los filtros y las cubiertas de los sistemas de flujo de aire laminar, y con qué finalidad?",a:"Acero inoxidable u otros materiales no degradables, para prevenir que un exceso de partículas entre en el aire.",i:["Materiales absorbentes y porosos, para retener la humedad y favorecer la acumulación de partículas.","Materiales flexibles y degradables, para facilitar la liberación de partículas hacia los filtros.","Materiales aislantes de baja resistencia, para reducir la filtración y aumentar la circulación del aire exterior."]},
{q:"¿Qué tipos de sistemas se pueden distinguir según sean abiertos o de circuito cerrado?",a:"Sistemas abiertos y sistemas de circuito cerrado, siendo estos últimos muy comunes en procesos que emplean sustancias tóxicas.",i:["Sistemas turbulentos y laminares, siendo los turbulentos exclusivos de procesos con sustancias tóxicas.","Sistemas de presión positiva y negativa, siendo los de presión negativa los únicos utilizados con sustancias tóxicas.","Sistemas de filtración simple y doble, siendo la filtración doble exclusiva de procesos con sustancias tóxicas."]}


{q:"¿Qué dos normativas rigen las salas blancas?",a:"La ISO 14644 y las normas GMP EU.",i:["La ISO 9001 y las normas UNE-EN.","La ISO 14001 y las normas FDA."]},
{q:"¿Cuál es la normativa ISO específica de las salas blancas?",a:"La ISO 14644.",i:["La ISO 9001.","La ISO 14001."]},
{q:"¿Qué representa la clasificación ISO de las salas blancas en relación con las partículas del aire?",a:"El número máximo de partículas permitido según su tamaño; cuanto mayor es la clase ISO, mayor es la concentración de partículas permitida.",i:["El grado de esterilidad de los materiales; cuanto mayor es la clase ISO, menor es la concentración de partículas permitida.","La presión del aire de la sala; cuanto mayor es la clase ISO, mayor es la presión interior."]},
{q:"¿Qué son las normas GMP EU (Good Manufacturing Practices)?",a:"Son las Normas de Correcta Fabricación que establecen estándares de calidad para fabricar medicamentos y son de obligado cumplimiento para la industria farmacéutica.",i:["Son normas internacionales voluntarias que regulan exclusivamente el diseño y la construcción de salas blancas.","Son normas de seguridad industrial que regulan únicamente la fabricación de equipos electrónicos."]},
{q:"¿Cómo se relacionan las clasificaciones ISO con los grados de limpieza de las normas GMP EU?",a:"El grado A se relaciona con ISO 4.8; el grado B en reposo, con ISO 5; el grado C en reposo y en funcionamiento, con ISO 7 e ISO 8, respectivamente; y el grado D en reposo, con ISO 8.",i:["El grado A se relaciona con ISO 5; el grado B en reposo, con ISO 7; el grado C, con ISO 8; y el grado D, con ISO 9.","El grado A se relaciona con ISO 8; el grado B en reposo, con ISO 4.8; el grado C, con ISO 5; y el grado D, con ISO 7."]}

{q:"¿Por qué se requiere una sala blanca y a quién se pretende proteger según el sector?",a:"Para reducir los contaminantes y proteger al producto en microelectrónica, al producto y al consumidor en las industrias farmacéutica y alimentaria, y al paciente en hospitales.",i:["Para controlar únicamente la temperatura y proteger al personal de mantenimiento.","Para aumentar la producción y proteger solo los equipos industriales."]},
{q:"¿Qué tipos de barreras se utilizan para luchar contra las infecciones?",a:"Barreras personales (vestuario), estructurales (instalaciones) y arquitectónicas (espacios diseñados para contener infecciones).",i:["Barreras químicas, térmicas y eléctricas.","Barreras mecánicas, digitales y acústicas."]},
{q:"¿Qué medidas se utilizan para prevenir las infecciones nosocomiales?",a:"Higiene de manos y personal, ropa protectora, control ambiental, política antibiótica y prevención de infecciones en los profesionales.",i:["Uso exclusivo de antibióticos y reducción de la ventilación.","Limpieza ocasional de las instalaciones y aislamiento de todo el personal."]},
{q:"¿Qué espacios hospitalarios pueden considerarse salas blancas o zonas limpias?",a:"Bloques quirúrgicos y obstétricos, UCI, habitaciones de aislamiento, salas de esterilización y laboratorios de microbiología, entre otros.",i:["Únicamente las habitaciones de los pacientes y las salas de espera.","Principalmente las cafeterías, oficinas administrativas y zonas de descanso."]},
{q:"¿Cómo se clasifican las salas hospitalarias según su riesgo de infección?",a:"En cuatro niveles: riesgo bajo, moderado, alto y muy alto.",i:["En tres niveles: leve, medio y crítico.","En cinco niveles según la temperatura y la humedad."]},

{q:"¿Cuáles son los principales objetivos del Plan Funcional de un centro sanitario?",a:"Garantizar la accesibilidad, flexibilidad, eficiencia, seguridad, limpieza e higiene; mitigar el impacto ambiental, organizar las circulaciones y crear un ambiente terapéutico positivo para pacientes, familias y profesionales.",i:["Reducir el personal, limitar la expansión y priorizar únicamente el ahorro económico.","Garantizar la comodidad del personal y la rapidez de las consultas, sin considerar las circulaciones ni el impacto ambiental."]},
{q:"¿De qué depende el nivel de riesgo de infección y qué tipos de riesgo existen?",a:"Depende del estado del paciente y del tipo de procedimiento. Se distinguen tres niveles: riesgo bajo, medio y alto.",i:["Depende únicamente de la duración de la estancia hospitalaria y se divide en dos niveles: leve y grave.","Depende de la temperatura de la sala y se clasifica en riesgo bajo, moderado, alto y muy alto."]},
{q:"¿Qué diferencia hay entre las zonas blancas, grises y negras de un bloque quirúrgico?",a:"Las blancas son de circulación restringida y mayor asepsia; las grises, de circulación semirrestringida; y las negras, de circulación general.",i:["Las blancas son de circulación general, las grises son restringidas y las negras son semirrestringidas.","Las blancas se destinan a pacientes, las grises exclusivamente a material y las negras únicamente al personal médico."]},
{q:"¿Qué función tiene la presión positiva y cuándo se utiliza la presión negativa en las salas blancas?",a:"La presión positiva evita la entrada de contaminantes y protege al paciente; la negativa contiene los contaminantes y protege el entorno.",i:["La presión positiva expulsa el aire contaminado hacia las zonas limpias y la negativa protege al paciente de los microorganismos externos.","Ambas presiones tienen la misma función: aumentar la ventilación y mantener constante la temperatura."]},
{q:"¿Cuáles son las principales medidas para reducir el riesgo de infección en un bloque quirúrgico?",a:"Higiene de manos, vestimenta adecuada, uso de material estéril, limpieza y desinfección, ventilación apropiada, control de accesos y movimientos, y cumplimiento de las normas de funcionamiento.",i:["Aumentar el número de personas en quirófano, reducir la limpieza entre intervenciones y limitar el uso de material estéril.","Utilizar antibióticos de forma generalizada, mantener las puertas abiertas y reducir la ventilación de las salas."]},

{q:"¿Cuáles son las tres fases del listado de comprobación de seguridad quirúrgica y cuándo se realizan?",a:"Sign In, antes de la anestesia; Time Out, después de la anestesia y antes de la incisión; y Sign Out, durante el cierre de la herida quirúrgica.",i:["Preparación, intervención y recuperación, realizadas después de la operación.","Identificación, anestesia y alta, realizadas al finalizar la intervención."]},
{q:"¿Qué medidas se utilizan para prevenir errores en la identificación del paciente, la zona quirúrgica y el procedimiento?",a:"Verificación preoperatoria, identificación inequívoca del paciente, marcado de la zona quirúrgica y comprobación final antes de comenzar la intervención.",i:["Comprobar únicamente el nombre del paciente después de la intervención.","Confiar en la memoria del equipo y evitar repetir las comprobaciones."]},
{q:"¿Cuáles son las principales medidas para prevenir las infecciones nosocomiales en el bloque quirúrgico?",a:"Higiene de manos, vestimenta adecuada, material estéril, limpieza y desinfección, ventilación apropiada y aplicación de protocolos de prevención.",i:["Limitar las medidas de higiene al finalizar la intervención.","Reducir la ventilación y reutilizar el material sin esterilizarlo."]},
{q:"¿Qué medidas deben adoptarse para prevenir errores de medicación y garantizar la seguridad de los medicamentos?",a:"Etiquetar medicamentos y soluciones, verificar la identidad del paciente con dos métodos, almacenar correctamente los fármacos y evitar confusiones entre medicamentos similares.",i:["Preparar los medicamentos sin etiquetarlos si se van a utilizar pronto.","Confiar en el color de los envases para identificar los medicamentos."]},
{q:"¿Qué es la gestión de riesgos sanitarios y qué medidas se utilizan para mejorar la seguridad del paciente?",a:"Es el proceso de identificar, registrar y analizar riesgos e incidentes para prevenir que se repitan, mediante protocolos, auditorías, formación y acciones de mejora continua.",i:["Es el registro exclusivo de los errores que causan daños graves.","Consiste en atribuir los incidentes a una persona sin analizar sus causas."]},

{q:"¿Cuáles son las funciones principales de las instalaciones eléctricas en el bloque quirúrgico?",a:"Proporcionar alumbrado normal y de emergencia, garantizar el suministro eléctrico y proteger la seguridad de pacientes y trabajadores.",i:["Regular la temperatura, la humedad y la filtración del aire del quirófano.","Distribuir los gases medicinales y controlar la presión de las salas."]},
{q:"¿Qué función tienen el transformador de aislamiento y el sistema de vigilancia de aislamiento en un quirófano?",a:"El transformador de aislamiento limita las corrientes de fuga y reduce el riesgo eléctrico. El vigilador detecta defectos y activa una alarma para que mantenimiento los solucione antes de un segundo fallo.",i:["El transformador regula la temperatura y el vigilador controla la humedad ambiental.","El transformador garantiza la iluminación de emergencia y el vigilador controla el suministro de gases medicinales."]},
{q:"¿Qué condiciones de temperatura, humedad, filtración y presión debe garantizar la climatización de un quirófano?",a:"Temperatura de 22-26 °C, humedad relativa del 45-55 %, tres niveles de filtración y sobrepresión respecto a las zonas adyacentes para evitar la entrada de aire contaminado.",i:["Temperatura de 17-20 °C, humedad del 20-30 %, un nivel de filtración y presión negativa.","Temperatura de 27-30 °C, humedad del 60-70 %, dos niveles de filtración y presión neutra."]},
{q:"¿Qué medidas garantizan el suministro eléctrico en caso de fallo de la alimentación normal?",a:"Se utilizan suministros complementarios, como generadores y baterías. En quirófanos, el suministro especial debe activarse automáticamente en un máximo de 0,5 segundos y tener una autonomía mínima de 2 horas.",i:["Se utiliza únicamente la red eléctrica normal, con una activación manual después de 5 segundos.","Se emplean exclusivamente generadores que pueden tardar hasta 10 segundos en activarse y deben funcionar durante 30 minutos."]},
{q:"¿Qué instalaciones y comprobaciones deben revisarse antes de poner un quirófano en funcionamiento?",a:"Deben revisarse las instalaciones eléctricas, climatización, gases medicinales, vacío y protección contra incendios. También se comprueban la puesta a tierra, los aislamientos, los caudales de aire, los filtros, la estanqueidad, las presiones, la temperatura y la humedad.",i:["Solo deben revisarse la iluminación, el mobiliario y la limpieza superficial del quirófano.","Únicamente deben comprobarse los gases medicinales y la temperatura, sin necesidad de verificar los sistemas eléctricos."]},

{q:"¿Qué pruebas principales se realizan para comprobar la seguridad de las instalaciones de gases medicinales?",a:"Se comprueban la estanqueidad de canalizaciones, válvulas y tomas; la eliminación de partículas; las válvulas de seguridad; las conexiones cruzadas; el cambio a la fuente de reserva; las alarmas, la alimentación eléctrica de emergencia y la pureza del gas tras el purgado.",i:["Se comprueban únicamente la presión de las botellas y la temperatura del quirófano.","Se revisan solo las tomas de gases y la limpieza exterior de las tuberías, sin comprobar alarmas ni fuentes de reserva."]},
{q:"¿Cómo se comprueba que no existen conexiones cruzadas entre las instalaciones de distintos gases medicinales?",a:"Se comprueba cada instalación por separado, aislando las demás de su fuente de alimentación y verificando que cada gas salga únicamente por las tomas que le corresponden.",i:["Se abren simultáneamente todas las instalaciones y se comprueba que los gases salgan por cualquier toma disponible.","Se revisa únicamente la presión general de la instalación, sin comprobar por qué tomas sale cada gas."]},
{q:"¿Qué se verifica durante las pruebas de la instalación de vacío y qué condiciones se consideran motivo de rechazo?",a:"Se comprueba la estanqueidad de las canalizaciones, las llaves de seccionamiento y las tomas. Se rechaza la instalación si hay fugas o pérdidas de presión superiores a los límites establecidos.",i:["Se comprueba únicamente la pureza del oxígeno y se rechaza la instalación si las alarmas funcionan correctamente.","Se mide solo la temperatura de las canalizaciones y se rechaza la instalación cuando la presión permanece estable."]},
{q:"¿Qué requisitos generales debe cumplir el mantenimiento de un bloque quirúrgico?",a:"Debe contar con personal especializado en áreas críticas, un programa de mantenimiento específico, controles periódicos y coordinación con limpieza y control ambiental. También debe disponer de registros históricos de las operaciones.",i:["Debe realizarse únicamente cuando se avería un equipo, sin necesidad de registros ni controles periódicos.","Debe depender exclusivamente del personal de limpieza, sin un programa específico ni supervisión técnica."]},
{q:"¿Con qué periodicidad se realizan las revisiones eléctricas y de climatización más importantes, y qué aspectos se comprueban?",a:"En electricidad, se revisan semanalmente los dispositivos de vigilancia y protección, mensualmente la continuidad y el aislamiento, y anualmente las protecciones, la puesta a tierra y los suministros complementarios. En climatización, los filtros se revisan mensualmente y se realizan revisiones más amplias semestrales y anuales.",i:["La electricidad se revisa solo anualmente y la climatización cada cinco años, comprobando únicamente que los equipos enciendan.","La electricidad se revisa diariamente y la climatización semanalmente, sin realizar pruebas de aislamiento, caudales ni estanqueidad."]},

{q:"¿Qué diferencias hay entre la difusión de aire en quirófanos tipo A y tipo B?",a:"Tipo A: unidireccional, 3.600 m³/h. Tipo B: turbulenta, 2.400 m³/h.",i:["Tipo A: turbulenta, 2.400 m³/h. Tipo B: unidireccional, 3.600 m³/h.","Ambos utilizan difusión unidireccional con un caudal de 3.600 m³/h."]},
{q:"¿Qué filtros y presiones diferenciales se utilizan en los quirófanos tipo A y tipo B?",a:"Tipo A: H14 y +20 Pa. Tipo B: H13-H14 y +10 Pa.",i:["Tipo A: H13 y +10 Pa. Tipo B: H14 y +20 Pa.","Ambos utilizan filtros H13 y una presión negativa de −10 Pa."]},
{q:"¿Qué recomienda la presentación sobre el uso de aire exterior y la recirculación en el quirófano?",a:"Recomienda que todo el aire impulsado sea exterior, sin recirculación.",i:["Recomienda recircular todo el aire para reducir el consumo energético.","Recomienda utilizar únicamente 1.200 m³/h de aire exterior y recircular el resto."]},
{q:"¿Qué tipos de recuperadores de energía existen y qué límite de transmisión de partículas se indica?",a:"De baterías, placas y rotativos. En los que no son de baterías, la transmisión no debe superar 1/1000.",i:["De filtros, ventiladores y compresores, con un límite de transmisión de 1/100.","De baterías y placas únicamente, sin límites de transmisión de partículas."]},
{q:"¿Qué medidas permiten controlar la ventilación y reducir el consumo energético del bloque quirúrgico?",a:"Controlar caudal y presión, ajustar el aire exterior y aprovechar simultaneidades.",i:["Mantener siempre el caudal máximo y eliminar el control de presión diferencial.","Reducir la ventilación sin controlar la calidad del aire ni la presión."]},

{q:"¿Qué normativa regula la seguridad de las instalaciones eléctricas en quirófanos?",a:"El REBT (RD 842/2002), especialmente las ITC-BT-28, ITC-BT-38 e ITC-BT-05.",i:["El Código Técnico de la Edificación y la ITC-BT-19 únicamente.","La normativa ISO 14644 y el Real Decreto 1093/2010."]},
{q:"¿Cuáles son los principales riesgos eléctricos en un quirófano y cómo se previenen?",a:"Fallos eléctricos, cables dañados y equipos mojados; se previenen revisando equipos, usando toma de tierra y evitando cables sueltos.",i:["Únicamente las sobrecargas; se previenen aumentando la humedad ambiental.","Las infecciones y el ruido; se previenen mediante filtros HEPA y presión positiva."]},
{q:"¿Qué se debe hacer cuando se activa la alarma del monitor de aislamiento eléctrico?",a:"Parar la actividad cuanto antes, avisar a los responsables e informar a los técnicos de los equipos en uso.",i:["Desconectar todas las protecciones y continuar la intervención.","Reiniciar el monitor y continuar sin comunicar la alarma."]},
{q:"¿Cómo se debe actuar ante un corte del suministro eléctrico durante una intervención quirúrgica?",a:"Esperar 30-40 segundos por si vuelve el suministro; si no regresa, avisar a los responsables y actuar según el protocolo de seguridad.",i:["Reanudar inmediatamente la intervención sin comprobar el suministro.","Desconectar todos los equipos y abandonar el quirófano sin avisar."]},
{q:"¿Con qué frecuencia se revisan las instalaciones eléctricas del quirófano y qué se registra?",a:"Semanalmente se revisan alarmas y protecciones; mensualmente, continuidad y aislamiento; anualmente, una empresa autorizada. Se anotan resultados, fechas, anomalías y firma.",i:["Solo se revisan cada cinco años y se registra únicamente el coste.","Se revisan diariamente por una empresa externa y solo se anotan las averías graves."]},

{q:"¿A qué sistemas de emergencia debe estar conectado el cuadro eléctrico principal de la UCI?",a:"Al grupo electrógeno y al sistema de alimentación ininterrumpida (SAI).",i:["Únicamente a la red eléctrica convencional del hospital.","A un sistema de iluminación de emergencia y a una batería independiente por habitación."]},
{q:"¿Cuál es la función principal de un sistema de alimentación ininterrumpida (SAI)?",a:"Proporcionar alimentación eléctrica de respaldo ante interrupciones del suministro.",i:["Regular la presión del oxígeno medicinal.","Controlar la temperatura y la humedad de los boxes."]},
{q:"¿Cuántas tomas eléctricas se recomiendan en las paredes de cada habitación de UCI según el apartado de instalaciones?",a:"Seis tomas eléctricas en las paredes.",i:["Dos tomas eléctricas en las paredes.","Dieciséis tomas eléctricas exclusivamente en las paredes."]},
{q:"¿Cuántas tomas eléctricas se indican para el cabecero suspendido del box?",a:"Dieciséis tomas eléctricas.",i:["Cuatro tomas eléctricas.","Ocho tomas eléctricas."]},
{q:"¿Qué ventaja ofrece el cabecero suspendido en un box de UCI?",a:"Integra conexiones eléctricas y de gases, reduce los cables por el suelo y facilita el acceso al paciente.",i:["Elimina la necesidad de equipos electromédicos portátiles.","Sustituye los sistemas eléctricos de emergencia."]},
{q:"¿De dónde procede el suministro de oxígeno y aire comprimido de la UCI?",a:"De las correspondientes centrales del hospital.",i:["De compresores portátiles instalados individualmente en cada cama.","De los sistemas de vacío de cada habitación."]},
{q:"¿Qué elementos de seguridad deben incorporar las tomas de oxígeno y aire comprimido?",a:"Alarmas de presión y sistemas de cierre.",i:["Únicamente indicadores luminosos de funcionamiento normal.","Exclusivamente fusibles eléctricos y diferenciales."]},
{q:"¿Qué sistema de alarma se recomienda para las tomas de vacío de la UCI?",a:"Un sistema de alarma de bajada de presión.",i:["Una alarma de exceso de temperatura del gas.","Una alarma de fallo de comunicación con el monitor cardíaco."]},
{q:"¿Para qué sirve un caudalímetro en una instalación de gases medicinales?",a:"Para regular y controlar el caudal del gas suministrado, por ejemplo, oxígeno.",i:["Para medir la presión arterial de forma no invasiva.","Para comprobar la continuidad eléctrica de los equipos."]},
{q:"¿Para qué sirve un vacuómetro en una instalación de aspiración?",a:"Para indicar el nivel de vacío o presión negativa de la instalación.",i:["Para medir el caudal de oxígeno inspirado por el paciente.","Para medir la resistencia de aislamiento de un respirador."]},
{q:"¿Qué parámetros puede monitorizar el monitor multiparamétrico descrito en el documento?",a:"ECG, presión arterial no invasiva, temperatura, pulsioximetría y presión invasiva, entre otros.",i:["Únicamente temperatura ambiental, humedad y presión eléctrica.","Exclusivamente concentración de oxígeno y presión de vacío."]},
{q:"¿Qué información proporciona la capnografía incorporada en un respirador?",a:"Permite monitorizar el dióxido de carbono, habitualmente mediante la medición del CO₂ espirado.",i:["Mide la resistencia de aislamiento eléctrico del respirador.","Regula la presión de la red de oxígeno del hospital."]},
{q:"¿Cuál es la función principal de una bomba de perfusión?",a:"Administrar líquidos o medicamentos de forma controlada a un caudal programado.",i:["Generar vacío para los sistemas de aspiración.","Medir la actividad eléctrica cardíaca sin sensores."]},
{q:"¿Para qué se utiliza una bomba de nutrición enteral?",a:"Para administrar nutrición a través de una sonda enteral de forma controlada.",i:["Para administrar descargas eléctricas durante una desfibrilación.","Para suministrar aire comprimido al respirador desde la instalación central."]},
{q:"¿Qué equipo se incluye en la dotación del área del carro de paradas de la UCI?",a:"Un desfibrilador con palas de adulto.",i:["Un caudalímetro con sensor de pulsioximetría.","Un vacuómetro conectado a una bomba de nutrición enteral."]},
{q:"¿Qué equipos aparecen en el documento para una sala de técnicas o implantación de marcapasos?",a:"Estimulador eléctrico cardíaco, generador externo de marcapasos provisional, programador de marcapasos y monitor multiparamétrico, entre otros.",i:["Únicamente bombas de nutrición enteral y equipos de climatización.","Exclusivamente equipos de esterilización y lavadoras industriales."]},
{q:"¿Por qué deben disponer los SAI y los paneles de aislamiento de un espacio específico?",a:"Para facilitar su mantenimiento.",i:["Para utilizarlos como almacén de material fungible.","Para impedir que el personal técnico acceda a ellos."]},
{q:"¿Qué normativa eléctrica cita el documento para las instalaciones de la UCI?",a:"El Reglamento Electrotécnico para Baja Tensión (REBT), aprobado por el Real Decreto 842/2002.",i:["Exclusivamente la normativa de seguridad alimentaria hospitalaria.","Únicamente el reglamento de instalaciones térmicas en edificios."]},
{q:"¿Qué característica deben tener los acabados de los locales de la UCI para facilitar su mantenimiento?",a:"Deben permitir una limpieza adecuada y resistir impactos de carros y equipos portátiles pesados.",i:["Deben tener superficies difíciles de limpiar y juntas abiertas.","Deben impedir el acceso a las instalaciones para evitar intervenciones técnicas."]},
{q:"¿Qué debe hacer un técnico antes de devolver al servicio un equipo electromédico tras una reparación?",a:"Comprobar su funcionamiento y las seguridades aplicables, registrar la intervención y confirmar que puede utilizarse con seguridad.",i:["Entregarlo en cuanto vuelva a encenderse, sin realizar más comprobaciones.","Borrar el registro de la incidencia para evitar confusiones con futuras averías."]},

{q:"¿En qué ciudad se encuentra la Clínica Oberig?",a:"En Kiev, Ucrania.",i:["En Varsovia, Polonia.","En Bucarest, Rumanía."]},
{q:"¿Qué tipo de UCI se proyectó para la Clínica Oberig?",a:"Una UCI polivalente para pacientes con procesos médicos y quirúrgicos.",i:["Una UCI exclusivamente pediátrica.","Una UCI dedicada únicamente a pacientes traumatológicos."]},
{q:"¿Cuántos boxes generales tiene la UCI de la Clínica Oberig?",a:"Siete boxes generales.",i:["Cinco boxes generales.","Diez boxes generales."]},
{q:"¿Qué clasificación ISO tienen los boxes generales?",a:"ISO 8.",i:["ISO 5.","ISO 7."]},
{q:"¿Qué clasificación ISO tiene el box de aislamiento para pacientes infecciosos?",a:"ISO 7.",i:["ISO 8.","ISO 9."]},
{q:"¿Qué ventaja ofrece situar los boxes cerca del control de enfermería?",a:"Facilita atender rápidamente las necesidades de los pacientes.",i:["Elimina la necesidad de monitorización.","Permite prescindir de las alarmas de los equipos."]},
{q:"¿Dónde se encuentra la central de monitorización de pacientes?",a:"En el control de enfermería.",i:["En la sala de espera de familiares.","En el office sucio."]},
{q:"¿Qué sistemas de alarma se describen para los boxes?",a:"Alarmas acústicas diferenciadas por tipo de box, señales luminosas en las entradas y alarmas de los equipos de monitorización.",i:["Únicamente alarmas visuales en el control de enfermería.","Solo alarmas acústicas generales sin diferenciación."]},
{q:"¿Qué sistema permite la comunicación entre el paciente y enfermería?",a:"El sistema de comunicación paciente-enfermera.",i:["El sistema de climatización.","El control de presión diferencial."]},
{q:"¿Qué ventaja tienen los cabezales colgados de los boxes?",a:"Reducen la cantidad de cables en el suelo al integrar las instalaciones necesarias.",i:["Eliminan la necesidad de tomas eléctricas.","Sustituyen los sistemas de ventilación."]},
{q:"¿Qué porcentaje de las camas incluye una balanza integrada?",a:"El 50 % de las camas.",i:["El 25 % de las camas.","El 100 % de las camas."]},
{q:"¿Qué sistema de emergencia se instala en cada box y se conecta al control de enfermería?",a:"Un sistema de alarma de emergencia por paro cardíaco.",i:["Un sistema automático de apertura de ventanas.","Un regulador de presión de los fan-coils."]},
{q:"¿Qué función tienen las puertas enclavadas del box de aislamiento?",a:"Evitar que ambas puertas estén abiertas al mismo tiempo y se pierda la presión negativa.",i:["Mantener una presión positiva respecto al pasillo.","Regular automáticamente la temperatura del paciente."]},
{q:"¿Qué tipo de filtros se utilizan en la recirculación del aire de los boxes de la UCI?",a:"Filtros HEPA.",i:["Filtros de carbón exclusivamente para eliminar olores.","Filtros instalados únicamente en los baños."]},
{q:"¿Cuál es el porcentaje máximo de recirculación de aire recomendado en los boxes de la UCI?",a:"Un máximo del 50 %.",i:["Un máximo del 25 %.","Un máximo del 100 %."]},
{q:"¿Qué elemento permite cerrar individualmente la climatización de un box que no está en uso?",a:"Las compuertas automáticas de cada habitación.",i:["Las puertas de vidrio con control de privacidad.","Las alarmas luminosas de la entrada."]},
{q:"¿Desde dónde se pueden controlar la temperatura y la presión de cada sala?",a:"Desde el sistema de control ambiental situado en el puesto de enfermería.",i:["Únicamente desde la sala de máquinas.","Desde los ordenadores de la sala de espera."]},
{q:"¿Qué presión de aire tiene un box general respecto al pasillo?",a:"Presión positiva, que dificulta la entrada de microorganismos.",i:["Presión negativa, que extrae el aire hacia el pasillo.","La misma presión en todo momento, sin diferencias."]},
{q:"¿Qué relación de presión existe entre el box de aislamiento, la esclusa y el pasillo?",a:"El box tiene presión negativa respecto a la esclusa, y la esclusa tiene presión negativa respecto al pasillo.",i:["El box tiene presión positiva respecto a la esclusa y al pasillo.","El box y la esclusa tienen presión positiva respecto al pasillo."]},
{q:"¿Qué características deben tener los materiales de acabado de los boxes?",a:"Ser resistentes al roce y a los impactos, no inflamables y fáciles de limpiar y mantener.",i:["Ser porosos, inflamables y difíciles de limpiar.","Absorber líquidos y evitar el mantenimiento periódico."]},

{q:"¿Cuál es la función principal de las salas de reanimación tras una intervención?",a:"Permitir la recuperación del paciente tras la anestesia antes de volver a su habitación o irse a casa.",i:["Realizar exclusivamente pruebas diagnósticas antes de la cirugía.","Sustituir permanentemente a las unidades de hospitalización."]},
{q:"¿Cómo se denomina también la unidad de recuperación postanestésica?",a:"Sala del despertar.",i:["Sala de esterilización.","Unidad de consultas externas."]},
{q:"¿Cada cuánto tiempo se controlan el pulso, la respiración y la presión arterial durante la primera hora de recuperación?",a:"Cada 15 minutos.",i:["Cada 5 minutos durante toda la estancia hospitalaria.","Una sola vez al finalizar la recuperación."]},
{q:"¿Qué dos tipos de unidades de reanimación se distinguen?",a:"La URPA o sala del despertar y la unidad de cuidados críticos posquirúrgicos.",i:["La unidad de consultas y la unidad de esterilización.","La unidad de radiología y la unidad de rehabilitación."]},
{q:"¿Por qué es importante la coordinación del equipo en reanimación?",a:"Para trabajar conjuntamente siguiendo los protocolos establecidos.",i:["Para que cada profesional trabaje sin comunicarse con los demás.","Para evitar la monitorización de las constantes vitales."]},

{q:"¿Qué significa URPA?",a:"Unidad de Recuperación Postanestésica.",i:["Unidad de Reanimación Pulmonar Avanzada.","Unidad de Radiología y Pruebas Anestésicas."]},
{q:"¿Qué pacientes deben recibir atención postanestésica en una unidad capacitada?",a:"Los pacientes sometidos a anestesia general o regional, sedación o anestesia monitorizada, salvo indicación contraria del anestesiólogo.",i:["Únicamente los pacientes sometidos a anestesia local sin sedación.","Solo los pacientes que no presentan ninguna enfermedad previa."]},
{q:"¿Qué función tiene el anestesiólogo durante la estancia en la URPA?",a:"Supervisar la recuperación, controlar las constantes vitales, tratar complicaciones y comprobar la recuperación de las funciones orgánicas.",i:["Limitarse a gestionar las citas posteriores del paciente.","Realizar exclusivamente el inventario del material sanitario."]},
{q:"¿Qué complicaciones respiratorias pueden aparecer en la URPA?",a:"Obstrucción o espasmo respiratorio, hipoxemia e hipoventilación.",i:["Hiperglucemia, fracturas óseas y dermatitis.","Únicamente hipertensión arterial crónica."]},
{q:"¿Qué equipamiento de reanimación se utiliza para responder ante una parada cardiorrespiratoria?",a:"Carros de reanimación con desfibrilador y material revisado.",i:["Carros de curas sin material de emergencia.","Equipos de ecografía como único recurso de reanimación."]},

{q:"¿Qué pacientes pueden ingresar en una unidad de reanimación quirúrgica o de traumatología?",a:"Pacientes graves, sometidos a cirugía compleja, con traumatismos importantes o complicaciones quirúrgicas graves.",i:["Únicamente pacientes que acuden a una consulta rutinaria.","Solo pacientes que necesitan una extracción de sangre."]},
{q:"¿Qué factores pueden determinar el ingreso de un paciente en reanimación?",a:"La invasividad de la cirugía, la patología preoperatoria y la intensidad del dolor posoperatorio.",i:["La edad del equipo médico y el número de consultas externas.","Exclusivamente la duración de la visita preoperatoria."]},
{q:"¿Qué dispositivos de visualización de la vía aérea se mencionan en el equipamiento de reanimación?",a:"Fibrobroncoscopios desechables y rígidos, y videolaringoscopio.",i:["Únicamente otoscopios y oftalmoscopios.","Solo equipos de radiografía dental."]},
{q:"¿Qué equipo de imagen se incluye para apoyar la valoración del paciente?",a:"Un ecógrafo con varias sondas.",i:["Un mamógrafo como único equipo de imagen.","Un densitómetro óseo sin otras herramientas diagnósticas."]},
{q:"¿Qué tipo de ventiladores se mencionan en el equipamiento de reanimación?",a:"Ventiladores no invasivos.",i:["Únicamente ventiladores domésticos sin monitorización.","Exclusivamente sistemas de aspiración quirúrgica."]},

{q:"¿Qué caracteriza a la Cirugía Mayor Ambulatoria (CMA)?",a:"Permite realizar una intervención quirúrgica sin ingreso hospitalario ni pernocta, con retorno a casa tras la recuperación.",i:["Obliga a permanecer ingresado varias noches en todos los casos.","Se limita a procedimientos diagnósticos sin cirugía."]},
{q:"¿Qué clasificación ASA suele ser adecuada para los pacientes candidatos a CMA?",a:"ASA I y II; algunos pacientes ASA III y pediátricos pueden considerarse según su situación clínica y apoyo domiciliario.",i:["Exclusivamente ASA IV y V.","Todos los pacientes ASA III y IV sin valorar su estado clínico."]},
{q:"¿Qué características deben tener, en general, los procedimientos de CMA?",a:"Durar menos de 90 minutos, producir una pérdida de sangre mínima y tener complicaciones poco frecuentes o fácilmente resolubles.",i:["Durar siempre más de cuatro horas y causar grandes pérdidas sanguíneas.","Requerir obligatoriamente vigilancia hospitalaria durante varios días."]},
{q:"¿Qué tipos de unidades de CMA se distinguen según su relación con el hospital?",a:"Integradas, satélite e independientes.",i:["Respiratorias, cardiológicas y neurológicas.","Públicas, privadas y exclusivamente pediátricas."]},
{q:"¿Qué condiciones debe cumplir un paciente para recibir el alta tras una CMA?",a:"Poder caminar, tolerar líquidos, controlar el dolor con analgesia oral, recuperar la función sensitiva y motora cuando corresponda y no presentar complicaciones activas.",i:["Presentar dolor intenso y sangrado activo.","Mantener alteraciones motoras importantes y dificultad respiratoria."]},

{q:"¿Qué recién nacidos atiende la unidad neonatal descrita?",a:"Recién nacidos con una edad gestacional inferior a 28 semanas o un peso inferior a 1.000 gramos.",i:["Recién nacidos con más de 37 semanas y un peso superior a 2.500 gramos.","Niños mayores de cinco años con enfermedades leves."]},
{q:"¿Qué tipo de ventilación avanzada está disponible en la unidad neonatal?",a:"Ventilación de alta frecuencia.",i:["Únicamente ventilación ambiental sin soporte respiratorio.","Solo nebulización sin equipos de ventilación."]},
{q:"¿Qué gas terapéutico se menciona entre los recursos de asistencia respiratoria neonatal?",a:"Óxido nítrico.",i:["Dióxido de carbono como tratamiento respiratorio habitual.","Helio utilizado como único recurso de monitorización."]},
{q:"¿Qué parámetros y funciones se pueden supervisar mediante la monitorización central de esta unidad?",a:"Parámetros cardiopulmonares, hemodinámicos y gasométricos.",i:["Únicamente el peso y la longitud del recién nacido.","Solo la temperatura ambiental de la habitación."]},
{q:"¿Qué sistema permite realizar una monitorización continua de la actividad cerebral del recién nacido?",a:"La monitorización EEG continua mediante aEEG.",i:["La ecografía de alta resolución por sí sola.","La monitorización de presión arterial sin registro cerebral."]},

function mezclar(array){
  const copia = [...array];
  for(let i = copia.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [copia[i], copia[j]] = [copia[j], copia[i]];
  }
  return copia;
}

function actualizarContador(){
  contadorEl.textContent = `Aciertos: ${ok} | Fallos: ${fallos}`;
}

function actualizarBarra(){
  const pct = (respondidas / Math.max(1, juego.length)) * 100;
  barraGlobalEl.style.width = `${pct}%`;
}

function actualizarRacha(){
  if(racha > 0){
    rachaEl.textContent = "¡Racha! " + "⭐".repeat(Math.min(racha,5));
  } else {
    rachaEl.textContent = "";
  }
}

function renderProgress(){
  progressEl.innerHTML = "";

  for(let j = 0; j < juego.length; j++){
    const sq = document.createElement("div");
    sq.className = "square";

    if(j < respondidas){
      sq.classList.add(
        juego[j] && juego[j].acierto ? "ok" : "ko"
      );
    }

    progressEl.appendChild(sq);
  }
}

function iniciarTemporizador(){
  clearInterval(intervalo);
  clearTimeout(timeoutPregunta);

  tiempo = TIEMPO_PREGUNTA;
  timerEl.textContent = tiempo;

  intervalo = setInterval(() => {
    tiempo--;
    timerEl.textContent = tiempo;

    if(tiempo <= 0){
      clearInterval(intervalo);
    }
  }, 1000);

  timeoutPregunta = setTimeout(() => {
    tiempoAgotado();
  }, TIEMPO_PREGUNTA * 1000);
}

function tiempoAgotado(){
  clearInterval(intervalo);

  const preg = juego[i];

  // La pregunta sin responder cuenta como fallo
  preg.acierto = false;
  preg.sinResponder = true;

  fallos++;
  racha = 0;

  respondidas = Math.min(i + 1, juego.length);

  actualizarContador();
  actualizarBarra();
  renderProgress();
  actualizarRacha();

  const btns = app.querySelectorAll("button");
  btns.forEach(btn => {
    btn.disabled = true;
    if(btn.dataset.ans === preg.a){
      btn.classList.add("correct");
    }
  });

  setTimeout(() => {
    i++;

    if(i < juego.length){
      mostrar();
    } else {
      fin();
    }
  }, 500);
}

function mostrar(){
  if(i >= juego.length){
    fin();
    return;
  }

  const preg = juego[i];
  const ops = mezclar([preg.a, ...preg.i]);

  app.innerHTML = `
    <div class="card">
      <h3>${i + 1}. ${preg.q}</h3>
      ${ops.map(op => `
        <button data-ans="${op}">${op}</button>
      `).join("")}
    </div>
  `;

  app.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => responder(btn.dataset.ans));
  });

  actualizarContador();
  renderProgress();
  iniciarTemporizador();
}

function responder(resp){
  clearInterval(intervalo);
  clearTimeout(timeoutPregunta);

  const preg = juego[i];
  const btns = app.querySelectorAll("button");
  const ok_resp = resp === preg.a;

  btns.forEach(btn => {
    btn.disabled = true;

    if(btn.dataset.ans === preg.a){
      btn.classList.add("correct");
    }

    if(btn.dataset.ans === resp && !ok_resp){
      btn.classList.add("incorrect");
    }
  });

  preg.acierto = ok_resp;

  if(ok_resp){
    ok++;
    racha++;
  } else {
    fallos++;
    racha = 0;
  }

  respondidas = Math.min(i + 1, juego.length);

  actualizarContador();
  actualizarBarra();
  renderProgress();
  actualizarRacha();

  setTimeout(() => {
    i++;

    if(i < juego.length){
      mostrar();
    } else {
      fin();
    }
  }, 800);
}

function fin(){
  clearInterval(intervalo);
  clearTimeout(timeoutPregunta);

  const score = Math.round((ok / juego.length) * 100);

  const msg =
    score >= 70
      ? "¡Muy bien! 🎉"
      : score >= 50
        ? "Buen intento 👍"
        : "Sigue practicando 💪";

  app.innerHTML = `
    <div class="card resumen">
      <h2>🎯 Test terminado</h2>
      
      <div class="stat-box">
        <span>Jugador:</span>
        <strong>${jugador}</strong>
      </div>

      <div class="stat-box">
        <span>Respuestas correctas:</span>
        <strong>${ok} / ${juego.length}</strong>
      </div>

      <div class="stat-box">
        <span>Fallos:</span>
        <strong>${fallos}</strong>
      </div>

      <div class="stat-box">
        <span>Porcentaje:</span>
        <strong>${score}%</strong>
      </div>

      <div class="stat-box">
        <span>Resultado:</span>
        <strong>${msg}</strong>
      </div>

      <div class="button-group">
        <button id="resetBtn">🎮 Jugar otra vez</button>
        <button id="cambiarNombreBtn">👤 Otro jugador</button>
      </div>
    </div>
  `;

  document.getElementById("resetBtn").addEventListener("click", iniciar);

  document.getElementById("cambiarNombreBtn").addEventListener("click", () => {
    const nuevoNombre = prompt("¿Cuál es tu nombre?", jugador);

    if(nuevoNombre && nuevoNombre.trim()){
      jugador = nuevoNombre.trim();
      localStorage.setItem("jugador", jugador);
      iniciar();
    }
  });

  rachaEl.textContent = "";
}

function iniciar(){
  clearInterval(intervalo);
  clearTimeout(timeoutPregunta);

  juego = mezclar(preguntas).slice(0, POR_PARTIDA);

  i = 0;
  ok = 0;
  fallos = 0;
  respondidas = 0;
  racha = 0;
  tiempo = TIEMPO_PREGUNTA;

  timerEl.textContent = TIEMPO_PREGUNTA;
  barraGlobalEl.style.width = "0%";
  rachaEl.textContent = "";

  actualizarContador();
  renderProgress();
  mostrar();
}

const nombreIngresado = prompt("¿Cuál es tu nombre?", jugador);

if(nombreIngresado && nombreIngresado.trim()){
  jugador = nombreIngresado.trim();
}

localStorage.setItem("jugador", jugador);

iniciar();

</script>
