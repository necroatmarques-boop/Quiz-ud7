  let pendientes = [];

// 👉 PEGA AQUÍ TUS PREGUNTAS
const preguntas = [
{q:"¿Qué es el ultrasonido terapéutico?",a:"Es un equipo de rehabilitación que transforma energía eléctrica en vibraciones mecánicas de alta frecuencia.",i:["Es un equipo que transforma energía magnética en radiación electromagnética.","Es un equipo que transforma energía térmica en impulsos eléctricos."]},
{q:"¿En qué frecuencias funcionan habitualmente los equipos de ultrasonido terapéutico?",a:"En el rango de los MHz, siendo especialmente habituales 1 MHz y 3 MHz.",i:["En el rango de los kHz, siendo habituales 10 kHz y 50 kHz.","En el rango de los GHz, siendo habituales 1 GHz y 3 GHz."]},
{q:"¿Debido a qué se logran los resultados del ultrasonido terapéutico?",a:"Debido a la absorción de la energía ultrasónica en el tejido, que provoca un calentamiento cuya intensidad depende de la capacidad de absorción de cada tejido.",i:["Debido a la reflexión total de la energía ultrasónica en la superficie de la piel.","Debido a la conversión de la energía ultrasónica en energía magnética dentro del tejido."]},
{q:"¿Qué otras aplicaciones terapéuticas del ultrasonido aparecen en el PDF, además de la rehabilitación?",a:"La litotricia, para la descomposición de cálculos renales, y la terapia contra el cáncer, para quemar tejido enfermo.",i:["La fototerapia neonatal y la pulsioximetría.","La estimulación osteoblástica y la mejora de la microcirculación."]},
{q:"¿Cuáles son los tres beneficios atribuidos al ultrasonido terapéutico?",a:"Aceleración del proceso de curación por aumento del flujo sanguíneo; disminución del dolor por reducción de la hinchazón y el edema; y masaje suave mediante el calentamiento de músculos, tendones y ligamentos.",i:["Aumento de la contracción muscular; eliminación de la melanina; y reducción de la temperatura del tejido.","Disminución de la frecuencia cardíaca; estimulación de la producción de fotones; y reducción de la actividad osteoblástica."]},
{q:"¿Qué es una onda?",a:"Una perturbación que se propaga transportando energía.",i:["Una deformación mecánica que siempre produce una diferencia de potencial eléctrico.","Una región donde actúan fuerzas magnéticas generadas por una corriente eléctrica."]},
{q:"¿Qué es una onda mecánica?",a:"Una onda que necesita un medio material para propagarse y que no puede propagarse en el vacío.",i:["Una onda que puede propagarse en el vacío y no necesita un medio material.","Una onda electromagnética que se propaga exclusivamente mediante campos eléctricos."]},
{q:"¿Qué necesitan las ondas mecánicas para propagarse?",a:"Necesitan un medio material.",i:["Necesitan un campo magnético pulsado.","Necesitan un medio de acoplamiento eléctrico."]},
{q:"¿Qué sucede cuando el transductor vibra sobre el tejido?",a:"Produce sucesivamente compresión, rarefacción, compresión y rarefacción.",i:["Produce sucesivamente expansión, contracción, reflexión y refracción.","Produce sucesivamente ionización, polarización, magnetización y calentamiento."]},
{q:"¿Cómo se representa la propagación de la energía acústica desde el transductor hasta el tejido?",a:"Transductor → vibración mecánica → compresión y rarefacción → propagación de energía acústica → tejido.",i:["Transductor → energía magnética → corriente continua → radiación óptica → tejido.","Transductor → amplificación óptica → emisión de fotones → reflexión → tejido."]},
{q:"¿Cuáles son los parámetros físicos de la onda que aparecen en el PDF?",a:"Frecuencia, periodo y longitud de onda.",i:["Potencia, intensidad acústica y ciclo de trabajo.","Amplitud, irradiancia y densidad óptica."]},
{q:"¿Por qué las frecuencias más altas penetran menos profundamente en los tejidos?",a:"Porque las frecuencias más altas se absorben más rápidamente, mientras que las frecuencias más bajas penetran más profundamente.",i:["Porque las frecuencias más altas se reflejan completamente y las más bajas se convierten en energía eléctrica.","Porque las frecuencias más altas producen menos vibración mecánica y las más bajas generan más calor."]},
{q:"¿Qué es el efecto piezoeléctrico?",a:"Es una propiedad de determinados materiales por la que una deformación mecánica puede producir una diferencia de potencial eléctrico y un campo eléctrico alterno puede producir deformaciones mecánicas.",i:["Es la propiedad por la que una bobina transforma una corriente eléctrica en un campo magnético pulsado.","Es la propiedad por la que un material absorbe energía luminosa y genera fotones."]},
{q:"¿Qué dos tipos de efecto piezoeléctrico existen?",a:"El efecto piezoeléctrico directo y el efecto piezoeléctrico inverso.",i:["El efecto piezoeléctrico térmico y el efecto piezoeléctrico magnético.","El efecto piezoeléctrico continuo y el efecto piezoeléctrico pulsado."]},
{q:"¿Cuál es la diferencia entre el efecto piezoeléctrico directo y el inverso?",a:"En el directo, una deformación mecánica produce una diferencia de potencial eléctrico; en el inverso, un campo eléctrico alterno provoca deformaciones del material y genera vibración mecánica.",i:["En el directo, una corriente genera un campo magnético; en el inverso, el campo magnético produce una corriente continua.","En el directo, la energía luminosa genera calor; en el inverso, el calor produce radiación electromagnética."]},
{q:"¿Por qué se necesita gel entre el cabezal del ultrasonido y la piel del paciente?",a:"Para favorecer la transmisión de la energía acústica entre el transductor y el tejido, ya que el aire dificultaría enormemente esa transferencia.",i:["Para aumentar la frecuencia de oscilación del cristal piezoeléctrico y reducir la potencia eléctrica.","Para enfriar el cristal piezoeléctrico y evitar que genere vibraciones mecánicas."]},
{q:"¿Cuáles son los principales bloques funcionales del equipo de ultrasonido terapéutico?",a:"Interfaz de usuario, fuente de alimentación, control o microcontrolador, generador de frecuencia, control del modo continuo o pulsado, amplificador de potencia y transductor piezoeléctrico; además del gel de acoplamiento y el paciente.",i:["Fuente de alimentación, bobina, solenoide, etapa de potencia, campo magnético y sistema de control.","Diodo láser, amplificador óptico, fibra óptica, sistema de refrigeración y gafas de protección."]},
{q:"¿Cuáles son los dos modos de trabajo del ultrasonido terapéutico?",a:"Modo continuo y modo pulsado.",i:["Modo magnético y modo electromagnético.","Modo térmico y modo óptico."]},
{q:"¿Qué diferencia existe entre el modo continuo y el modo pulsado?",a:"En el modo continuo el transductor está excitado continuamente durante la aplicación; en el pulsado se alternan periodos de emisión y periodos sin emisión (ON/OFF).",i:["En el continuo se alternan periodos ON/OFF y en el pulsado la emisión se mantiene permanentemente.","En el continuo se utiliza un campo magnético y en el pulsado se utiliza radiación luminosa."]},
{q:"¿Qué es la frecuencia ultrasónica y qué indica la frecuencia de repetición de pulsos?",a:"La frecuencia ultrasónica es la frecuencia de oscilación que excita al cristal piezoeléctrico; la frecuencia de repetición de pulsos indica cuántas veces se producen los periodos ON/OFF.",i:["La frecuencia ultrasónica indica cuántas veces se producen los periodos ON/OFF; la frecuencia de repetición de pulsos es la oscilación que excita al cristal.","La frecuencia ultrasónica indica la potencia acústica emitida; la frecuencia de repetición de pulsos indica la intensidad distribuida sobre el área."]},
{q:"¿Qué comprobaciones deben realizarse durante el mantenimiento preventivo del ultrasonido terapéutico?",a:"Inspección visual del equipo, revisión del cable del transductor, verificación del cabezal, limpieza y desinfección, comprobaciones de seguridad eléctrica y verificaciones funcionales y de potencia acústica.",i:["Comprobación de bobinas y solenoides, medición del campo magnético y revisión de la ventilación del aplicador.","Comprobación de fibras ópticas, medición de densidad óptica y revisión de las gafas de protección."]},
{q:"¿Qué precauciones deben tenerse durante la limpieza y desinfección del cabezal del ultrasonido?",a:"Retirar el gel conductor después de cada uso, sin sumergir el cabezal, aplicar líquidos directamente sobre los conectores ni utilizar disolventes agresivos.",i:["Sumergir el cabezal en agua y aplicar disolventes para eliminar los restos de gel.","Limpiar los conectores directamente con líquidos y mantener el gel conductor sobre la superficie emisora."]},

{q:"¿Qué es la magnetoterapia y en qué ámbitos se utiliza?",a:"Es una técnica terapéutica que utiliza campos magnéticos pulsados de baja frecuencia (CEMP o PEMF) para producir efectos biológicos sobre los tejidos. Se utiliza en rehabilitación, traumatología y medicina deportiva para favorecer la reparación tisular, la consolidación ósea y el alivio del dolor.",i:["Es una técnica que utiliza ondas mecánicas de alta frecuencia en fisioterapia para producir calentamiento de los tejidos.","Es una técnica que utiliza radiación láser de alta potencia en traumatología para estimular la emisión de fotones."]},
{q:"¿Cuáles son las unidades de medida del campo magnético que aparecen en el PDF?",a:"Tesla (T) y Gauss (G).",i:["Vatios (W) y milivatios (mW).","Hercios (Hz) y nanómetros (nm)."]},
{q:"¿Cuál es la relación entre Tesla y Gauss?",a:"1 Tesla equivale a 10.000 Gauss.",i:["1 Tesla equivale a 1.000 Gauss.","1 Tesla equivale a 100 Gauss."]},
{q:"¿Qué intensidad de campo magnético se utiliza habitualmente en magnetoterapia y qué frecuencias se emplean?",a:"Se utilizan campos relativamente bajos, de 1 a 100 Gauss (0,1 a 10 mT), con frecuencias normalmente entre 1 y 100 Hz.",i:["Se utilizan campos de 100 a 1.000 Gauss, con frecuencias entre 100 y 1.000 Hz.","Se utilizan campos de 1 a 10 Gauss, con frecuencias entre 1 y 10 MHz."]},
{q:"¿Cómo generan los equipos de magnetoterapia los campos magnéticos pulsados?",a:"Generan campos magnéticos variables en el tiempo mediante impulsos eléctricos que atraviesan una bobina.",i:["Generan campos magnéticos constantes mediante vibraciones mecánicas que atraviesan un transductor.","Generan campos magnéticos variables mediante fotones emitidos por un diodo semiconductor."]},
{q:"¿Cuáles son las características principales de los campos magnéticos pulsados?",a:"Intensidad de campo, frecuencia, forma de onda y tiempo de tratamiento.",i:["Potencia acústica, longitud de onda, periodo y área de aplicación.","Temperatura, irradiancia, densidad óptica y tiempo de exposición."]},
{q:"¿Qué tipos de señales pueden utilizarse en magnetoterapia?",a:"Cuadrada, sinusoidal, triangular y pulsada.",i:["Continua, alterna, infrarroja y ultravioleta.","Monocromática, coherente, colimada y pulsada."]},
{q:"¿Qué es una bobina?",a:"Es un conductor enrollado en forma helicoidal que, cuando recibe corriente eléctrica, genera un campo magnético.",i:["Es un cristal piezoeléctrico que transforma energía eléctrica en vibraciones mecánicas.","Es una estructura óptica que concentra la energía luminosa en una superficie pequeña."]},
{q:"¿Qué elementos son los emisores responsables de crear el campo magnético terapéutico?",a:"Las bobinas.",i:["Los transductores piezoeléctricos.","Los diodos láser semiconductores."]},
{q:"¿Cuáles son los cuatro parámetros importantes de una bobina?",a:"Número de espiras, intensidad eléctrica, diámetro y material del núcleo.",i:["Frecuencia, longitud de onda, potencia y periodo.","Temperatura, presión, velocidad de propagación y tiempo de tratamiento."]},
{q:"¿Qué sucede cuando aumenta el número de espiras o la corriente eléctrica de una bobina?",a:"Aumenta el campo magnético.",i:["Disminuye el campo magnético y aumenta la distancia de penetración.","Se reduce la intensidad de campo y aumenta la frecuencia de la señal."]},
{q:"¿Para qué partes del cuerpo se utilizan las bobinas planas?",a:"Para rodilla, hombro, codo y muñeca.",i:["Para introducir extremidades completas, brazos y piernas en su interior.","Para tratamientos muy específicos mediante aplicadores localizados."]},
{q:"¿Qué permiten hacer las bobinas flexibles?",a:"Permiten adaptarse al contorno corporal.",i:["Permiten introducir una extremidad completa y generar un campo uniforme en su interior.","Permiten aumentar automáticamente la intensidad de corriente de la bobina."]},
{q:"¿Qué es un solenoide?",a:"Es una bobina larga formada por numerosas espiras que, cuando se alimenta eléctricamente, genera un campo magnético prácticamente uniforme en su interior.",i:["Es una bobina plana utilizada exclusivamente para rodilla, hombro, codo y muñeca.","Es un conductor recto que genera un campo magnético únicamente cuando se encuentra desconectado."]},
{q:"¿Cuáles son las ventajas del solenoide?",a:"Permite introducir extremidades, mano, brazo o pierna, generando una distribución homogénea del campo magnético.",i:["Permite adaptarse al contorno corporal sin necesidad de introducir la extremidad en su interior.","Permite concentrar la energía luminosa en una pequeña superficie y reducir la divergencia del haz."]},
{q:"¿Cuáles son las aplicaciones del solenoide en magnetoterapia?",a:"Fracturas, osteoporosis, edemas y procesos inflamatorios.",i:["Tendinitis, esguinces, capsulitis y artrosis exclusivamente.","Litotricia, terapia contra el cáncer y descomposición de cálculos renales."]},
{q:"¿De qué factores depende la intensidad del campo magnético generado por una bobina o solenoide?",a:"Del número de espiras, la corriente eléctrica, la geometría de la bobina y la distancia.",i:["De la longitud de onda, el diámetro del cristal piezoeléctrico, la temperatura y la potencia acústica.","Del tiempo de tratamiento, la irradiancia, la frecuencia ultrasónica y el material del gel."]},
{q:"¿Qué ocurre cuando aumenta el número de espiras de una bobina?",a:"Se genera un mayor campo magnético.",i:["Disminuye la intensidad del campo magnético.","Aumenta la distancia respecto a la bobina y disminuye el campo."]},
{q:"¿Qué ocurre cuando aumenta la corriente eléctrica que atraviesa una bobina?",a:"Aumenta la intensidad del campo magnético.",i:["Disminuye la intensidad del campo magnético.","La forma del aplicador modifica exclusivamente la distribución del campo."]},
{q:"¿Qué efecto tiene la geometría de la bobina sobre el campo magnético?",a:"La forma del aplicador modifica la distribución del campo.",i:["La forma del aplicador determina exclusivamente la frecuencia de repetición de los impulsos.","La forma del aplicador determina la longitud de onda de la radiación emitida."]},
{q:"¿Cómo influye la distancia respecto a la bobina en la intensidad del campo magnético?",a:"El campo magnético disminuye conforme aumenta la separación respecto a la bobina.",i:["El campo magnético aumenta conforme aumenta la separación respecto a la bobina.","El campo magnético permanece constante independientemente de la distancia."]},
{q:"¿Cuáles son los bloques funcionales de un equipo de magnetoterapia?",a:"Fuente de alimentación, generador de señales o impulsos, etapa de potencia, aplicadores (bobinas o solenoides) y sistema de control.",i:["Fuente de alimentación, generador de frecuencia ultrasónica, amplificador acústico y transductor piezoeléctrico.","Diodo láser, amplificador óptico, fibra óptica, aplicador y sistema de refrigeración."]},
{q:"¿Cuáles son los efectos fisiológicos de la magnetoterapia sobre el tejido óseo?",a:"Estimulación osteoblástica, consolidación de fracturas y reparación ósea.",i:["Reducción del edema, efecto antiinflamatorio y aceleración de la cicatrización.","Mejora de la microcirculación, disminución del dolor y mejora funcional."]},
{q:"¿Cuáles son los efectos fisiológicos de la magnetoterapia sobre los tejidos blandos?",a:"Reducción del edema, efecto antiinflamatorio y aceleración de la cicatrización.",i:["Estimulación osteoblástica, consolidación de fracturas y reparación ósea.","Mejora de la microcirculación, disminución del dolor y mejora funcional."]},
{q:"¿Cuáles son los efectos fisiológicos de la magnetoterapia sobre la circulación?",a:"Mejora de la microcirculación.",i:["Estimulación osteoblástica y consolidación de fracturas.","Reducción del edema y aceleración de la cicatrización."]},
{q:"¿Cuáles son los efectos analgésicos de la magnetoterapia?",a:"Disminución del dolor y mejora funcional.",i:["Estimulación osteoblástica y reparación ósea.","Mejora de la microcirculación y aceleración de la cicatrización."]},
{q:"¿Para qué se utiliza la magnetoterapia en traumatología?",a:"Para tratar fracturas, pseudoartrosis y retrasos de consolidación.",i:["Para tratar tendinitis, esguinces y capsulitis.","Para tratar artrosis y artritis."]},
{q:"¿Para qué se utiliza la magnetoterapia en rehabilitación?",a:"Para tratar tendinitis, esguinces y capsulitis.",i:["Para tratar fracturas, pseudoartrosis y retrasos de consolidación.","Para tratar lesiones musculares y recuperación postraumática."]},
{q:"¿Para qué se utiliza la magnetoterapia en reumatología?",a:"Para tratar artrosis y artritis.",i:["Para tratar fracturas, pseudoartrosis y retrasos de consolidación.","Para tratar lesiones musculares y recuperación postraumática."]},
{q:"¿Para qué se utiliza la magnetoterapia en medicina deportiva?",a:"Para tratar lesiones musculares y favorecer la recuperación postraumática.",i:["Para tratar artrosis y artritis.","Para tratar exclusivamente fracturas, pseudoartrosis y retrasos de consolidación."]},
{q:"¿Cuáles son las contraindicaciones absolutas de la magnetoterapia?",a:"Marcapasos, desfibriladores implantables, neuroestimuladores y embarazo en la zona abdominal y lumbar.",i:["Procesos tumorales, hemorragias activas e infecciones agudas.","Tendinitis, esguinces, capsulitis y lesiones musculares."]},
{q:"¿Cuáles son las contraindicaciones relativas de la magnetoterapia?",a:"Procesos tumorales, hemorragias activas e infecciones agudas.",i:["Marcapasos, desfibriladores implantables y neuroestimuladores.","Fracturas, pseudoartrosis y retrasos de consolidación."]},
{q:"¿Qué comprobaciones deben realizarse durante la inspección visual del equipo de magnetoterapia y con qué periodicidad?",a:"Se debe verificar el estado del equipo, pantalla, teclado, carcasa y etiquetado. La periodicidad es mensual.",i:["Se debe comprobar la potencia emitida, la integridad de las fibras ópticas y la limpieza de las superficies ópticas. La periodicidad es anual.","Se debe comprobar el estado del cabezal piezoeléctrico, el cable del transductor y la emisión acústica. La periodicidad es trimestral."]},
{q:"¿Qué elementos deben comprobarse en los aplicadores de magnetoterapia y con qué periodicidad?",a:"La integridad de las bobinas, ausencia de grietas y estado de conectores y cables. La periodicidad es mensual.",i:["La potencia óptica, las fibras ópticas y la refrigeración. La periodicidad es anual.","El estado del cristal piezoeléctrico, el gel y la superficie emisora. La periodicidad es trimestral."]},
{q:"¿Qué medidas se realizan durante la verificación de seguridad eléctrica de un equipo de magnetoterapia y con qué periodicidad?",a:"Continuidad del conductor de protección, resistencia de aislamiento y corriente de fuga. Se realiza anualmente o según las indicaciones del fabricante.",i:["Intensidad emitida, homogeneidad del campo y correspondencia con los valores programados. Se realiza mensualmente.","Encendido, selección de programas, regulación de intensidad y temporizador. Se realiza anualmente."]},
{q:"¿Qué se comprueba durante la verificación de la emisión magnética, con qué instrumentos y con qué periodicidad?",a:"Se comprueban la intensidad emitida, la homogeneidad del campo y su correspondencia con los valores programados mediante un teslámetro o gaussímetro. La periodicidad es anual.",i:["Se comprueban la potencia acústica y la estabilidad de emisión mediante una balanza de radiación acústica. La periodicidad es trimestral.","Se comprueban la potencia óptica y la irradiancia mediante un medidor de potencia láser. La periodicidad es mensual."]},
{q:"¿Qué avería puede provocar que un equipo de magnetoterapia no encienda?",a:"Un fusible o una fuente de alimentación defectuosos.",i:["Una bobina abierta o una etapa de potencia averiada.","Un conector defectuoso o una ventilación obstruida."]},
{q:"¿Cuál puede ser la causa de que un equipo de magnetoterapia no genere campo magnético?",a:"Una bobina abierta; se debe medir su continuidad.",i:["Un fusible o una fuente de alimentación defectuosos; se debe realizar una verificación eléctrica.","Una ventilación obstruida; se debe realizar una limpieza interna."]},
{q:"¿Qué puede provocar una intensidad magnética incorrecta y qué se debe comprobar?",a:"Una avería en la etapa de potencia; se deben verificar las señales.",i:["Una bobina abierta; se debe medir la continuidad del conductor de protección.","Un conector defectuoso; se debe comprobar la resistencia de aislamiento."]},
{q:"¿Cuál puede ser la causa de un error de comunicación en un equipo de magnetoterapia y qué actuación requiere?",a:"Un conector defectuoso; se debe revisar el cableado.",i:["Una bobina abierta; se debe medir la continuidad.","Una ventilación obstruida; se debe realizar una limpieza interna."]},
{q:"¿Cuál puede ser la causa del sobrecalentamiento de un equipo de magnetoterapia y cómo se corrige?",a:"Una ventilación obstruida; se debe realizar una limpieza interna.",i:["Una bobina abierta; se debe medir la continuidad del conductor.","Una etapa de potencia averiada; se debe comprobar exclusivamente el cableado."]},

{q:"¿Por qué se caracteriza la luz?",a:"Por su longitud de onda, frecuencia y energía de los fotones.",i:["Por su intensidad de campo, número de espiras y corriente eléctrica.","Por su potencia acústica, frecuencia ultrasónica y ciclo de trabajo."]},

{q:"¿Cuáles son las cuatro características fundamentales del haz láser?",a:"Monocromático, coherente, colimado y de alta densidad energética.",i:["Visible, infrarrojo, ultravioleta y electromagnético.","Continuo, pulsado, térmico y mecánico."]},
{q:"¿Qué significa que un haz láser sea monocromático?",a:"Que la luz emitida posee una única longitud de onda o una banda muy estrecha.",i:["Que las ondas luminosas están sincronizadas.","Que presenta muy poca divergencia y mantiene una dirección definida."]},
{q:"¿Qué significa que un haz láser sea coherente?",a:"Que las ondas luminosas están sincronizadas.",i:["Que posee una única longitud de onda o una banda muy estrecha.","Que permite concentrar energía en una pequeña superficie."]},
{q:"¿Qué significa que un haz láser sea colimado?",a:"Que presenta muy poca divergencia y mantiene una dirección definida.",i:["Que las ondas luminosas están sincronizadas.","Que posee una única longitud de onda o una banda muy estrecha."]},

{q:"¿Para qué se utilizan los equipos de láser terapéutico?",a:"En rehabilitación, medicina deportiva, traumatología, fisioterapia y tratamiento del dolor.",i:["En fototerapia neonatal, pulsioximetría y endoscopia exclusivamente.","En la generación de campos magnéticos pulsados y consolidación ósea mediante bobinas."]},
{q:"¿Qué efectos biológicos principales puede producir el láser terapéutico?",a:"Bioestimulación celular, aumento de la síntesis de ATP, reparación tisular, efecto antiinflamatorio, analgesia y mejora de la microcirculación.",i:["Estimulación osteoblástica, reducción de edema y consolidación de fracturas.","Vasoconstricción periférica, disminución de la conducción nerviosa y eliminación de grasas."]},

{q:"¿Qué es un diodo láser?",a:"Un semiconductor capaz de emitir radiación láser cuando es polarizado eléctricamente.",i:["Una bobina que genera campos magnéticos pulsados mediante impulsos eléctricos.","Un transductor piezoeléctrico que convierte energía eléctrica en vibraciones mecánicas."]},
{q:"¿Cuál es el primer paso del funcionamiento de un diodo láser cuando circula corriente eléctrica?",a:"Se inyectan electrones y huecos.",i:["Se produce amplificación óptica.","Se genera directamente el haz láser."]},
{q:"¿Qué sucede después de la inyección de electrones y huecos en el diodo láser?",a:"Se recombinan dentro de la unión PN.",i:["Se concentran sobre la retina.","Se produce una amplificación de la señal eléctrica manteniendo la frecuencia."]},
{q:"¿Qué se produce cuando los electrones y huecos se recombinan dentro de la unión PN?",a:"Se emiten fotones.",i:["Se generan campos magnéticos pulsados.","Se producen vibraciones mecánicas de alta frecuencia."]},
{q:"¿Qué ocurre después de la emisión de fotones en el funcionamiento del diodo láser?",a:"Se produce amplificación óptica y se genera el haz láser.",i:["Se produce una vasoconstricción periférica y una circulación sanguínea central.","Se amplifica una señal eléctrica para alimentar las bobinas."]},

{q:"¿Cuál es el principal riesgo de la radiación láser en materia de seguridad?",a:"El ojo es el órgano más vulnerable frente a la radiación láser.",i:["La piel es el único órgano vulnerable frente a la radiación láser.","El oído es el órgano más vulnerable frente a la radiación láser."]},
{q:"¿Por qué la córnea y el cristalino pueden aumentar el daño producido por la radiación láser?",a:"Porque pueden concentrar la energía luminosa sobre la retina, multiplicando los efectos de la exposición.",i:["Porque generan fotones dentro de la unión PN.","Porque aumentan la longitud de onda y reducen la divergencia del haz."]},

{q:"¿Qué lesiones puede producir la radiación láser en la córnea?",a:"Irritación, quemaduras y queratitis.",i:["Quemaduras retinianas, pérdida parcial de visión y escotomas permanentes.","Cataratas en determinadas longitudes de onda."]},

{q:"¿Por qué unas gafas de protección para 650 nm no necesariamente protegen frente a un láser de 980 nm?",a:"Porque las gafas deben proteger exactamente frente a la longitud de onda emitida por el láser utilizado.",i:["Porque las gafas solo protegen frente a radiación ultravioleta.","Porque la densidad óptica depende exclusivamente de la potencia eléctrica del equipo."]},

{q:"¿Qué es la crioterapia?",a:"Una técnica que utiliza el frío para provocar respuestas fisiológicas en el organismo.",i:["Una técnica que utiliza campos magnéticos pulsados de baja frecuencia.","Una técnica que utiliza vibraciones mecánicas de alta frecuencia."]},
{q:"¿En qué se basa la crioterapia?",a:"En provocar respuestas en el organismo cuando el ambiente está a una temperatura inferior a la corporal, alterando los mecanismos termorreguladores.",i:["En aplicar radiación electromagnética mediante un diodo semiconductor.","En generar campos magnéticos mediante impulsos eléctricos que atraviesan una bobina."]},
{q:"¿Qué respuesta produce el organismo ante el frío durante la crioterapia?",a:"Una vasoconstricción periférica para evitar la pérdida de calor, que puede acompañarse de piel de gallina.",i:["Una vasodilatación periférica para aumentar la pérdida de calor.","Una estimulación osteoblástica para favorecer la consolidación ósea."]},

{q:"¿Qué efecto metabólico se atribuye a la crioterapia?",a:"Provoca reacciones compensatorias, activa el metabolismo y favorece la eliminación de grasas.",i:["Disminuye la actividad metabólica y bloquea la circulación sanguínea.","Aumenta la producción de ATP mediante emisión estimulada de radiación."]},

{q:"¿Qué es el equipo Gymna Cryoflow?",a:"Un equipo de crioterapia que enfría aire y utiliza un sistema de bio-feedback para controlar la temperatura de la zona tratada.",i:["Un equipo de magnetoterapia que genera campos magnéticos mediante solenoides.","Un equipo de ultrasonido que convierte energía eléctrica en vibraciones mecánicas."]},

function mezclar(array) {
  const copia = [...array];

  for (let i = copia.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copia[i], copia[j]] = [copia[j], copia[i]];
  }

  return copia;
}

function actualizarContador() {
  contadorEl.textContent = `Aciertos: ${ok} | Fallos: ${fallos}`;
}

function actualizarBarra() {
  const pct = (respondidas / Math.max(1, juego.length)) * 100;
  barraGlobalEl.style.width = `${pct}%`;
}

function actualizarRacha() {
  if (racha > 0) {
    rachaEl.textContent = "¡Racha! " + "⭐".repeat(Math.min(racha, 5));
  } else {
    rachaEl.textContent = "";
  }
}

function renderProgress() {
  progressEl.innerHTML = "";

  for (let j = 0; j < juego.length; j++) {
    const sq = document.createElement("div");
    sq.className = "square";

    if (j < respondidas) {
      sq.classList.add(
        juego[j] && juego[j].acierto ? "ok" : "ko"
      );
    }

    progressEl.appendChild(sq);
  }
}

function mostrar() {
  if (i >= juego.length) {
    fin();
    return;
  }

  const preg = juego[i];
  const ops = mezclar([preg.a, ...preg.i]);

  app.innerHTML = `
    <div class="card">
      <h3>${i + 1}. ${preg.q}</h3>
      ${ops.map(op => `
        <button data-ans="${op}">${op}</button>
      `).join("")}
    </div>
  `;

  app.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => responder(btn.dataset.ans));
  });

  actualizarContador();
  renderProgress();
}

function responder(resp) {
  const preg = juego[i];
  const btns = app.querySelectorAll("button");
  const ok_resp = resp === preg.a;

  btns.forEach(btn => {
    btn.disabled = true;

    if (btn.dataset.ans === preg.a) {
      btn.classList.add("correct");
    }

    if (btn.dataset.ans === resp && !ok_resp) {
      btn.classList.add("incorrect");
    }
  });

  preg.acierto = ok_resp;

  if (ok_resp) {
    ok++;
    racha++;
  } else {
    fallos++;
    racha = 0;
  }

  respondidas = Math.min(i + 1, juego.length);

  actualizarContador();
  actualizarBarra();
  renderProgress();
  actualizarRacha();

  setTimeout(() => {
    i++;

    if (i < juego.length) {
      mostrar();
    } else {
      fin();
    }
  }, 800);
}

function fin() {
  const score = Math.round((ok / juego.length) * 100);

  const msg =
    score >= 70
      ? "¡Muy bien! 🎉"
      : score >= 50
        ? "Buen intento 👍"
        : "Sigue practicando 💪";

  app.innerHTML = `
    <div class="card resumen">
      <h2>🎯 Test terminado</h2>

      <div class="stat-box">
        <span>Respuestas correctas:</span>
        <strong>${ok} / ${juego.length}</strong>
      </div>

      <div class="stat-box">
        <span>Fallos:</span>
        <strong>${fallos}</strong>
      </div>

      <div class="stat-box">
        <span>Porcentaje:</span>
        <strong>${score}%</strong>
      </div>

      <div class="stat-box">
        <span>Resultado:</span>
        <strong>${msg}</strong>
      </div>

      <div class="button-group">
        <button id="resetBtn">🎮 Jugar otra vez</button>
      </div>
    </div>
  `;

  document.getElementById("resetBtn").addEventListener("click", iniciar);
  rachaEl.textContent = "";
}


function iniciar() {
  if (pendientes.length === 0) {
    pendientes = mezclar(preguntas);
  }

  juego = pendientes.splice(0, POR_PARTIDA);

  i = 0;
  ok = 0;
  fallos = 0;
  respondidas = 0;
  racha = 0;

  barraGlobalEl.style.width = "0%";
  rachaEl.textContent = "";

  actualizarContador();
  renderProgress();
  mostrar();
}


iniciar();
</script>
