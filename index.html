* { box-sizing: border-box; }

body {

<script>

const POR_PARTIDA = 20;
  let pendientes = [];

let juego = [];

// 👉 PEGA AQUÍ TUS PREGUNTAS
const preguntas = [
{q:"¿Qué es la radiación?",a:"La emisión, propagación y transferencia de energía desde una fuente hacia otro lugar, en forma de ondas electromagnéticas o partículas.",i:["La transmisión exclusiva de calor mediante contacto directo.","La emisión de materia sin transferencia de energía.","La propagación únicamente de ondas sonoras."]},
{q:"¿Qué dos formas de propagarse hay?",a:"Mediante ondas electromagnéticas y mediante partículas.",i:["Mediante ondas sonoras y corrientes eléctricas.","Mediante conducción y convección térmica.","Mediante ondas mecánicas y campos gravitatorios exclusivamente."]},
{q:"¿Cómo se propaga la radiación?",a:"Puede propagarse mediante ondas electromagnéticas o mediante partículas que transportan energía.",i:["Únicamente mediante ondas sonoras que necesitan un medio material.","Exclusivamente mediante partículas con carga eléctrica.","Únicamente mediante conducción térmica."]},
{q:"¿Qué dos tipos de radiación hay según su capacidad para producir ionización?",a:"Radiación ionizante y radiación no ionizante.",i:["Radiación térmica y radiación mecánica.","Radiación nuclear y radiación magnética exclusivamente.","Radiación visible y radiación sonora."]},
{q:"¿Qué es la radiación ionizante?",a:"La radiación que tiene energía suficiente para arrancar electrones de los átomos y producir iones.",i:["La radiación que únicamente produce calentamiento sin modificar la materia.","La radiación que no puede interactuar con los átomos.","La radiación que solo se propaga mediante ondas sonoras."]},
{q:"¿Qué es la radiación no ionizante?",a:"La radiación que no dispone de energía suficiente para provocar ionización.",i:["La radiación que siempre arranca electrones de los átomos.","La radiación que transforma todos los átomos en iones.","La radiación que únicamente puede proceder de procesos nucleares."]},
{q:"¿Cuáles son las principales magnitudes de la radiación electromagnética como onda?",a:"La longitud de onda (λ), la frecuencia (ν) y la velocidad de la luz (c).",i:["La masa, la carga eléctrica y la densidad del fotón.","La dosis absorbida, la dosis equivalente y la dosis efectiva.","La presión, la temperatura y la intensidad sonora."]},
{q:"¿Cuáles son las principales magnitudes de la radiación electromagnética como partículas?",a:"La radiación está formada por fotones, cuya energía viene determinada por la frecuencia mediante la relación E=hν.",i:["La radiación está formada por partículas cuya energía depende exclusivamente de su masa y temperatura.","Los fotones se caracterizan por su presión, volumen y densidad.","La energía de los fotones depende únicamente de la velocidad del sonido."]},
{q:"¿Qué es el espectro electromagnético?",a:"El conjunto de las radiaciones electromagnéticas ordenadas según su frecuencia, longitud de onda o energía.",i:["El conjunto de partículas subatómicas ordenadas según su masa.","La clasificación de las radiaciones exclusivamente según su capacidad ionizante.","El conjunto de ondas mecánicas ordenadas según su temperatura."]},
{q:"¿Cuáles son los tipos de radiación del espectro electromagnético ordenados de menor a mayor frecuencia?",a:"Ondas de radio, microondas, infrarrojo, luz visible, ultravioleta, rayos X y rayos gamma.",i:["Rayos gamma, rayos X, ultravioleta, luz visible, infrarrojo, microondas y ondas de radio.","Ondas de radio, infrarrojo, microondas, ultravioleta, rayos X, luz visible y rayos gamma.","Microondas, ondas de radio, luz visible, infrarrojo, rayos gamma, ultravioleta y rayos X."]},
{q:"¿Qué ocurre al aumentar la frecuencia y la energía de una radiación electromagnética y disminuir su longitud de onda?",a:"La radiación presenta mayor frecuencia y energía, y menor longitud de onda.",i:["Disminuye la frecuencia y aumenta la longitud de onda.","Disminuyen tanto la frecuencia como la energía.","La frecuencia, la energía y la longitud de onda aumentan simultáneamente."]},
{q:"¿Cuál es la diferencia fundamental entre los rayos X y los rayos gamma?",a:"Su origen: los rayos X se asocian habitualmente a procesos electrónicos extranucleares y los rayos gamma a procesos nucleares.",i:["Los rayos X son partículas y los rayos gamma son ondas electromagnéticas.","Los rayos X son siempre menos energéticos que los rayos gamma.","Los rayos X son no ionizantes y los rayos gamma son ionizantes."]},
{q:"¿Qué unidad del Sistema Internacional se utiliza para medir la exposición a la radiación?",a:"El culombio por kilogramo (C/kg).",i:["El gray (Gy).","El sievert (Sv).","El julio por segundo (J/s)."]},
{q:"¿Qué es la exposición X?",a:"Una magnitud que cuantifica la ionización producida por fotones en el aire y relaciona la carga eléctrica de los iones producidos con la masa de aire.",i:["La energía depositada por la radiación por unidad de masa de cualquier material.","La energía cinética transferida a partículas cargadas por unidad de masa.","La sensibilidad biológica de los órganos irradiados."]},
{q:"¿Cómo se mide la dosis absorbida?",a:"En gray (Gy), equivalente a un julio de energía depositada por kilogramo de masa (1 Gy = 1 J/kg).",i:["En sievert (Sv), equivalente a un culombio por kilogramo.","En culombio por kilogramo (C/kg), equivalente a la energía transferida al aire.","En hercios (Hz), equivalente a la energía emitida por segundo."]},
{q:"¿Qué es el kerma?",a:"La energía cinética transferida por la radiación a partículas cargadas secundarias por unidad de masa.",i:["La energía finalmente depositada en un material por unidad de masa.","La carga eléctrica producida por ionización en el aire por unidad de masa.","La sensibilidad de los órganos y tejidos a la radiación."]},
{q:"¿Qué relación existe entre la frecuencia y la longitud de onda de una radiación electromagnética?",a:"Son inversamente proporcionales: al aumentar la frecuencia, disminuye la longitud de onda.",i:["Son directamente proporcionales: al aumentar la frecuencia, aumenta la longitud de onda.","No existe ninguna relación entre ambas magnitudes.","La longitud de onda permanece siempre constante, independientemente de la frecuencia."]},
{q:"¿Cuál es la fórmula que relaciona la velocidad de la luz, la longitud de onda y la frecuencia?",a:"c = λν, es decir, la velocidad de la luz es igual al producto de la longitud de onda por la frecuencia.",i:["c = λ/ν, es decir, la velocidad de la luz es igual a la longitud de onda dividida entre la frecuencia.","c = λ + ν, es decir, la velocidad de la luz es la suma de la longitud de onda y la frecuencia.","c = ν/λ, es decir, la velocidad de la luz es igual a la frecuencia dividida entre la longitud de onda."]},
{q:"¿Qué unidad se utiliza para medir la dosis equivalente y la dosis efectiva?",a:"El sievert (Sv).",i:["El gray (Gy).","El culombio por kilogramo (C/kg).","El hercio (Hz)."]},
{q:"¿Qué diferencia existe entre la dosis absorbida y la dosis equivalente?",a:"La dosis absorbida mide la energía depositada por unidad de masa, mientras que la dosis equivalente considera además el tipo de radiación mediante un factor de ponderación.",i:["La dosis absorbida considera la sensibilidad de los órganos y la dosis equivalente mide únicamente la carga eléctrica en el aire.","La dosis absorbida mide la energía transferida a partículas secundarias y la dosis equivalente mide la energía eléctrica del tubo.","Ambas magnitudes son idénticas y se expresan siempre en gray."]},
{q:"¿Qué diferencia existe entre la dosis equivalente y la dosis efectiva?",a:"La dosis efectiva tiene en cuenta además la diferente sensibilidad de los órganos y tejidos irradiados.",i:["La dosis efectiva mide únicamente la ionización producida en el aire.","La dosis equivalente tiene en cuenta la sensibilidad de los órganos y la dosis efectiva solo el tipo de radiación.","La dosis efectiva mide exclusivamente la energía cinética transferida a partículas cargadas."]},
{q:"¿Qué diferencia existe entre el kerma y la dosis absorbida?",a:"El kerma representa la energía cinética transferida a partículas cargadas secundarias por unidad de masa, mientras que la dosis absorbida representa la energía depositada por unidad de masa.",i:["El kerma mide la sensibilidad de los órganos y la dosis absorbida mide la carga eléctrica producida en el aire.","El kerma mide exclusivamente la energía de los fotones y la dosis absorbida mide su frecuencia.","Ambas magnitudes representan exactamente lo mismo en cualquier condición."]},
{q:"¿Cuáles son las cuatro interacciones de los rayos X con la materia?",a:"Efecto fotoeléctrico, efecto Compton, producción de pares y dispersión Rayleigh.",i:["Efecto térmico, efecto magnético, ionización y fluorescencia.","Efecto fotoeléctrico, efecto Doppler, producción de neutrones y dispersión elástica.","Efecto Compton, efecto Joule, efecto piezoeléctrico y producción de electrones."]},
{q:"¿Qué es el efecto fotoeléctrico?",a:"Es una interacción en la que el fotón incidente entrega toda su energía al átomo, desaparece y provoca la expulsión de un electrón.",i:["Es una interacción en la que el fotón cambia de dirección sin perder energía y sin expulsar electrones.","Es una interacción en la que el fotón se transforma en un electrón y un positrón.","Es una interacción en la que el fotón continúa existiendo y pierde parte de su energía al dispersarse."]},
{q:"¿Qué es el efecto Compton?",a:"Es una interacción en la que un fotón expulsa un electrón y continúa existiendo, dispersándose en otra dirección con menor energía.",i:["Es una interacción en la que el fotón se absorbe completamente y desaparece.","Es una interacción en la que el fotón cambia de dirección sin perder energía.","Es una interacción en la que el fotón se transforma en un electrón y un positrón."]},
{q:"¿Qué es la producción de pares?",a:"Es una interacción en la que un fotón desaparece y se transforma en un electrón y un positrón, cuando tiene una energía mínima de 1,022 MeV.",i:["Es una interacción en la que un fotón expulsa un electrón y continúa existiendo con menor energía.","Es una interacción en la que el fotón se absorbe completamente y expulsa un electrón del átomo.","Es una interacción en la que un fotón cambia de dirección sin perder energía."]},
{q:"¿Qué es la dispersión Rayleigh?",a:"Es una interacción en la que el fotón cambia de dirección sin perder energía.",i:["Es una interacción en la que el fotón desaparece y expulsa un electrón.","Es una interacción en la que el fotón pierde parte de su energía y expulsa un electrón.","Es una interacción en la que el fotón se transforma en un electrón y un positrón."]},
{q:"¿Por qué es importante el efecto Compton?",a:"Porque produce radiación dispersa, que reduce el contraste de la imagen y contribuye a la exposición del paciente y del personal próximo.",i:["Porque aumenta siempre el contraste de la imagen y elimina la radiación dispersa.","Porque absorbe completamente todos los fotones y evita la exposición del paciente.","Porque produce exclusivamente radiación útil para formar la imagen."]},
{q:"¿Qué son las rejillas antidispersión?",a:"Son dispositivos que ayudan a reducir la radiación dispersa que llega al receptor de imagen.",i:["Son dispositivos que aumentan la producción de radiación dispersa para mejorar la imagen.","Son filtros que generan rayos X de mayor energía dentro del paciente.","Son detectores que convierten directamente los rayos X en ondas sonoras."]},
{q:"¿Qué ocurre con el fotón en el efecto fotoeléctrico y qué sucede con el electrón?",a:"El fotón se absorbe completamente y desaparece, mientras que un electrón es expulsado del átomo.",i:["El fotón continúa existiendo con menor energía y el electrón permanece ligado al átomo.","El fotón cambia de dirección sin perder energía y no se expulsa ningún electrón.","El fotón se transforma en un electrón y un positrón."]},
{q:"¿Qué diferencia fundamental existe entre el efecto fotoeléctrico y el efecto Compton?",a:"En el efecto fotoeléctrico el fotón se absorbe completamente; en el efecto Compton el fotón se dispersa, cambia de dirección y pierde parte de su energía.",i:["En ambos efectos el fotón desaparece por completo.","En el efecto fotoeléctrico el fotón no pierde energía y en el efecto Compton se absorbe completamente.","En el efecto fotoeléctrico se produce un positrón y en el efecto Compton se generan dos fotones."]},
{q:"¿Cuál es la energía mínima necesaria para que se produzca la producción de pares?",a:"1,022 MeV.",i:["511 eV.","1,022 keV.","100 keV."]},
{q:"¿Qué ocurre cuando un positrón se aniquila con un electrón y qué relación tiene este fenómeno con el PET?",a:"El positrón se aniquila con un electrón y se producen dos fotones de 511 keV; este fenómeno está relacionado con el funcionamiento del PET.",i:["Se producen dos electrones de 511 keV, fenómeno utilizado directamente en la radiografía convencional.","Se produce un único fotón de 1,022 keV, utilizado para generar imágenes de rayos X.","El positrón se convierte en un neutrón sin emitir radiación."]},
{q:"¿Cómo afecta el efecto fotoeléctrico a la imagen radiográfica y a la dosis absorbida por el paciente?",a:"Favorece el contraste radiográfico al aumentar las diferencias de absorción entre tejidos, pero también aumenta la energía absorbida por el paciente.",i:["Reduce el contraste radiográfico y evita que el paciente absorba energía.","Aumenta el contraste y elimina por completo la dosis absorbida por el paciente.","No influye en el contraste de la imagen ni en la energía absorbida por el paciente."]},
{q:"¿Qué ocurre con el fotón cuando alcanza la energía mínima necesaria para la producción de pares?",a:"El fotón desaparece y se transforma en un electrón y un positrón, cuando alcanza una energía mínima de 1,022 MeV.",i:["El fotón se absorbe y expulsa únicamente un electrón del átomo.","El fotón cambia de dirección sin perder energía.","El fotón se divide en dos fotones de 511 keV sin producir partículas."]},
{q:"¿Cuál es el esquema de la radiología convencional?",a:"Red eléctrica → alimentación → generador de rayos X → tubo de rayos X → colimador → paciente → rejilla → detector → procesamiento → imagen.",i:["Red eléctrica → detector → tubo → paciente → generador → imagen.","Generador → PACS → tubo → colimador → paciente → imagen.","Detector → alimentación → paciente → tubo → rejilla → imagen."]},
{q:"¿Cuál es el esquema del circuito de control?",a:"Consola o estación de adquisición → sistema de control → generador, mesa, Bucky y detector.",i:["Detector → paciente → tubo → red eléctrica.","Tubo → colimador → rejilla → PACS.","Red eléctrica → paciente → detector → consola."]},
{q:"¿Cuáles son las partes principales de un sistema de radiografía?",a:"Tubo de rayos X, generador de alto voltaje, colimador, cables de alta tensión, soporte o riel, detector y consola de control.",i:["Tubo de rayos X, ecógrafo, resonador magnético y monitor de presión.","Generador, electrocardiógrafo, transductor ultrasónico y mesa quirúrgica.","Detector, impresora, bomba de infusión y equipo de anestesia."]},
{q:"¿Cuáles son los parámetros principales del generador de alta tensión?",a:"kVp, mA y mAs.",i:["Hz, vatios y grados Celsius.","Longitud, anchura y volumen.","Densidad, contraste y resolución espacial."]},
{q:"¿En qué unidad se mide el producto de los miliamperios por el tiempo?",a:"En miliamperios-segundo (mAs).",i:["En kilovoltios (kV).","En milímetros (mm).","En miliamperios por centímetro (mA/cm)."]},
{q:"¿Qué es el generador de alto voltaje?",a:"Es el componente que proporciona la alta tensión y la corriente necesarias para el funcionamiento del tubo de rayos X y controla la exposición.",i:["Es el componente que almacena y visualiza las imágenes radiográficas.","Es el dispositivo que limita el campo de radiación mediante láminas móviles.","Es el componente que convierte directamente la imagen digital en una imagen impresa."]},
{q:"¿Desde dónde se emiten los rayos X?",a:"Desde el tubo de rayos X, donde los electrones acelerados desde el cátodo chocan contra el ánodo.",i:["Desde el detector digital, que genera la radiación hacia el paciente.","Desde el colimador, que produce los fotones mediante sus láminas.","Desde la rejilla antidispersión, que transforma la electricidad en rayos X."]},
{q:"¿Cuáles son los fallos típicos del generador de alta tensión?",a:"Fallos en la generación o regulación de la alta tensión, errores en los parámetros de exposición, problemas de temporización y comportamientos eléctricos anómalos.",i:["Únicamente fallos en la visualización del PACS y en la impresión de informes.","Exclusivamente roturas de las láminas del colimador.","Fallos relacionados solo con el movimiento de la mesa del paciente."]},
{q:"¿Cuáles son las partes principales del tubo de rayos X?",a:"Cátodo, con su filamento, y ánodo, alojados en una envoltura al vacío.",i:["Colimador, rejilla antidispersión y detector.","Consola, PACS y estación de diagnóstico.","Autotransformador, disyuntor y densitómetro."]},
{q:"¿Qué es el colimador y cuál es su función?",a:"Es el dispositivo que delimita el campo de rayos X para adaptarlo a la región que se desea estudiar y evitar irradiar zonas innecesarias.",i:["Es el dispositivo que convierte los rayos X en una señal eléctrica digital.","Es el sistema que genera la alta tensión aplicada al tubo.","Es el equipo que almacena las imágenes para su consulta posterior."]},
{q:"¿Cuáles son los principales fallos del colimador?",a:"La avería de la lámpara de campo luminoso, problemas de centrado, fallos mecánicos y falta de correspondencia entre el campo luminoso y el campo de radiación.",i:["La pérdida de conexión con el PACS como único fallo posible.","La disminución de la velocidad de rotación del ánodo como único fallo.","La avería exclusiva del sistema de refrigeración del detector."]},
{q:"¿Qué es el Bucky?",a:"Es el sistema que aloja y desplaza la rejilla antidispersión, normalmente asociado a la mesa o al soporte mural, para reducir la radiación dispersa que llega al detector.",i:["Es el generador que produce la alta tensión del tubo.","Es el programa informático que archiva las imágenes radiográficas.","Es el filamento del cátodo que emite electrones."]},
{q:"¿Qué diferencias existen entre CR y DR?",a:"CR utiliza una placa de fósforo que debe introducirse en un lector para digitalizar la imagen; DR utiliza un detector digital que obtiene la imagen directamente.",i:["CR utiliza siempre película convencional y DR utiliza exclusivamente papel fotográfico.","CR emplea un detector plano directo y DR necesita siempre un lector de placas independiente.","CR y DR funcionan con película química y no permiten obtener imágenes digitales."]},
{q:"¿Cómo funciona un detector digital de rayos X?",a:"Recibe los rayos X y los convierte en una señal que se procesa y digitaliza para formar la imagen.",i:["Genera rayos X y los dirige hacia el paciente sin registrar ninguna señal.","Almacena únicamente imágenes impresas y no utiliza señales eléctricas.","Transforma los rayos X en ondas sonoras que forman la imagen."]},
{q:"¿Qué es el PACS?",a:"Es un sistema informático para almacenar, gestionar, recuperar y distribuir imágenes médicas digitales.",i:["Es un generador de alta tensión para el tubo de rayos X.","Es un dispositivo mecánico que limita el campo de radiación.","Es un detector que convierte los rayos X en luz visible durante la exposición."]},
{q:"¿Cuáles son las características principales del PACS?",a:"Permite almacenar, organizar, recuperar, consultar y compartir imágenes médicas digitales.",i:["Genera la radiación, regula el filamento y controla la corriente del tubo.","Colima el haz, mueve la rejilla y posiciona al paciente de forma automática en todos los equipos.","Mide exclusivamente la dosis absorbida y no almacena imágenes."]},
{q:"¿Qué determina la calidad de una imagen radiográfica?",a:"Factores como el contraste, la resolución espacial, el ruido, la nitidez y la presencia de artefactos.",i:["Únicamente el tamaño del monitor donde se visualiza la imagen.","Solo el nombre del equipo que ha realizado la exposición.","Exclusivamente la velocidad con la que se imprime la imagen."]},
{q:"¿Qué es la densidad óptica?",a:"Es una medida del grado de oscurecimiento de una imagen radiográfica en película.",i:["Es la cantidad de radiación dispersa que atraviesa el colimador.","Es la distancia entre el tubo de rayos X y el detector.","Es la energía mínima necesaria para producir pares de partículas."]},
{q:"¿Qué es un densitómetro?",a:"Es un instrumento que mide la densidad óptica de una película radiográfica.",i:["Es un dispositivo que mide la tensión eléctrica del generador.","Es un equipo que digitaliza las placas de fósforo de un sistema CR.","Es un instrumento que delimita el campo de irradiación del paciente."]},
{q:"¿Qué factores influyen en la calidad de la imagen radiográfica?",a:"Los parámetros de exposición, la colimación, la radiación dispersa, el movimiento, las características del detector y el procesamiento de la imagen.",i:["Únicamente el color de la sala y la temperatura del monitor.","Solo la marca del equipo y el tamaño de la consola.","Exclusivamente el tiempo de almacenamiento de la imagen en el PACS."]},
{q:"¿Qué equipo se utiliza como medida de seguridad para reducir la radiación dispersa?",a:"La rejilla antidispersión, que reduce la cantidad de radiación dispersa que llega al detector.",i:["El densitómetro, que absorbe la radiación dispersa durante la exposición.","El PACS, que bloquea físicamente los rayos X antes de que lleguen al paciente.","El lector CR, que impide la producción de radiación en el tubo."]},
{q:"¿Qué función tienen los parámetros kVp, mA y mAs en la generación de rayos X?",a:"El kVp determina la tensión y afecta a la energía de los fotones; el mA indica la corriente del tubo y el mAs relaciona la corriente con el tiempo de exposición.",i:["El kVp mide la densidad óptica, el mA determina el tamaño del detector y el mAs mide la temperatura del tubo.","El kVp controla únicamente el PACS, el mA regula la colimación y el mAs mide la distancia al paciente.","Los tres parámetros miden exclusivamente el contraste final de la imagen."]},
{q:"¿Qué diferencia hay entre kVp y mAs?",a:"El kVp está relacionado con la energía y la capacidad de penetración de los rayos X; el mAs está relacionado con la cantidad de radiación producida.",i:["El kVp mide el tiempo de exposición y el mAs mide la energía máxima de los fotones.","El kVp controla el almacenamiento de imágenes y el mAs regula el movimiento de la mesa.","Ambos miden exactamente la misma magnitud y tienen la misma unidad."]},
{q:"¿Cuáles son las etapas del funcionamiento del generador de alta tensión?",a:"Red eléctrica → rectificación → bus de corriente continua → inversor de alta frecuencia → transformador de alta tensión → rectificación de alta tensión → tubo de rayos X.",i:["Tubo de rayos X → detector → PACS → red eléctrica → colimador.","Detector → inversor → rejilla → transformador de baja tensión → paciente.","Red eléctrica → PACS → tubo → impresora → transformador de alta tensión."]},
{q:"¿Qué función cumple la rejilla antidispersión en un sistema de radiografía convencional?",a:"Absorbe parte de la radiación dispersa antes de que llegue al detector, ayudando a mejorar el contraste de la imagen.",i:["Aumenta la radiación dispersa que llega al detector para mejorar la nitidez.","Genera los electrones que se aceleran dentro del tubo de rayos X.","Convierte la señal eléctrica del detector en una imagen digital."]},
{q:"¿Qué es DICOM y qué relación tiene con el PACS?",a:"DICOM es un estándar para el formato y la comunicación de imágenes médicas; permite que los equipos y el PACS intercambien imágenes e información asociada.",i:["DICOM es un generador de rayos X y el PACS es el colimador que dirige el haz.","DICOM es un detector de radiación y el PACS es una rejilla antidispersión.","DICOM es un parámetro de exposición y el PACS es una unidad de medida de la dosis."]},
{q:"¿Qué comprobaciones de mantenimiento preventivo se realizan en el generador, el tubo, el colimador y el detector?",a:"Se comprueban los parámetros y tiempos de exposición, la reproducibilidad, el funcionamiento del tubo, la luz y el centrado del colimador, y la calibración, uniformidad y presencia de artefactos en el detector.",i:["Solo se comprueba que la consola esté limpia y que el monitor esté encendido.","Se revisa únicamente la conexión del PACS, sin comprobar los componentes físicos.","Solo se mide la densidad óptica, sin revisar el generador, el tubo ni el detector."]},
  {q:"¿Qué es la tomografía computarizada (TC)?",a:"Es una técnica de diagnóstico por imagen que utiliza rayos X y detectores que giran alrededor del paciente para obtener múltiples medidas desde diferentes ángulos y reconstruir imágenes seccionales.",i:["Es una técnica que utiliza únicamente ondas sonoras para obtener imágenes del interior del cuerpo.","Es una técnica que utiliza campos magnéticos sin emplear rayos X.","Es una técnica que obtiene imágenes exclusivamente mediante radiación gamma emitida por el paciente."]},
{q:"¿Cuál es la cadena de generación de imágenes en la TC?",a:"Generación de rayos X → atenuación en el paciente → detección → señal eléctrica → digitalización → datos de proyección → reconstrucción → imagen TC.",i:["Generación de rayos X → PACS → paciente → detector → impresión directa.","Paciente → reconstrucción → generación de rayos X → detector → señal analógica.","Detector → generación de rayos X → digitalización → paciente → imagen."]},
{q:"¿Cómo funciona la tomografía computarizada?",a:"El tubo de rayos X y los detectores giran alrededor del paciente, registran la radiación atenuada desde distintos ángulos y el sistema informático reconstruye imágenes seccionales.",i:["Un detector fijo obtiene una única proyección y la convierte directamente en una imagen tridimensional.","El tubo permanece apagado mientras un sistema óptico registra imágenes del interior del paciente.","Los detectores emiten rayos X y el paciente los refleja hacia el tubo para formar la imagen."]},
{q:"¿Cuál es el diagrama de bloques funcional de un equipo de TC?",a:"Generador y tubo de rayos X → paciente → matriz de detectores → electrónica de adquisición (DAS) → sistema de reconstrucción → imagen TC → DICOM/PACS, coordinados por el sistema de control.",i:["PACS → paciente → generador → impresora → tubo de rayos X, sin detectores.","Detector → colimador → mesa → PACS → generador, sin sistema de reconstrucción.","Paciente → sistema de control → impresora → generador → imagen, sin adquisición de datos."]},
{q:"¿Qué es el gantry?",a:"Es la estructura del equipo de TC que contiene componentes como el tubo de rayos X, los detectores, los colimadores, el DAS, el sistema de rotación y los slip rings.",i:["Es el programa informático encargado exclusivamente de almacenar las imágenes.","Es el elemento que sostiene únicamente al paciente durante la exploración.","Es un detector externo que mide exclusivamente la dosis recibida por el operador."]},
{q:"¿Qué son los slip rings o anillos rozantes?",a:"Son sistemas que permiten transferir energía y/o señales entre las partes estacionarias y las rotatorias del gantry, haciendo posible la rotación continua.",i:["Son anillos metálicos que bloquean la radiación dispersa antes de llegar al detector.","Son piezas que inmovilizan la mesa para impedir cualquier movimiento durante la exploración.","Son circuitos que convierten directamente las imágenes digitales en película radiográfica."]},
{q:"¿Cuáles son los parámetros eléctricos fundamentales de la TC?",a:"Los principales son kVp, mA y mAs.",i:["FOV, matriz y tamaño de píxel.","Pitch, espesor de corte y tiempo de reconstrucción exclusivamente.","Densidad óptica, frecuencia acústica y temperatura ambiental."]},
{q:"¿Qué indican los parámetros eléctricos fundamentales kVp, mA y mAs?",a:"El kVp determina la tensión y afecta a la energía y penetración de los rayos X; el mA representa la corriente del tubo; y el mAs es el producto de la corriente por el tiempo de exposición.",i:["El kVp mide el tamaño del píxel, el mA indica el campo de visión y el mAs mide el espesor de corte.","El kVp determina la velocidad de la mesa, el mA mide la rotación del gantry y el mAs indica el número de detectores.","El kVp mide la densidad de la imagen, el mA controla el PACS y el mAs determina el tamaño del monitor."]},
{q:"¿Qué son los detectores de un equipo de TC?",a:"Son los componentes que reciben los rayos X atenuados por el paciente y los convierten en señales eléctricas medibles.",i:["Son los componentes que generan los electrones en el cátodo y los aceleran hacia el ánodo.","Son los dispositivos que almacenan las imágenes médicas en el PACS.","Son los elementos mecánicos que desplazan al paciente por el interior del gantry."]},
{q:"¿Qué tipo de detectores utilizan principalmente los equipos modernos de TC y por qué?",a:"Predominan los detectores de conversión indirecta, que transforman los rayos X en luz mediante un centelleador y después en señal eléctrica mediante un fotodiodo.",i:["Detectores exclusivamente fotográficos, porque registran la imagen directamente en película.","Detectores acústicos, porque convierten los rayos X en ondas sonoras que forman la imagen.","Detectores de conversión térmica, porque miden únicamente el calor producido por el paciente."]},
{q:"¿Qué es el DAS (Data Acquisition System) en la TC?",a:"Es el sistema de adquisición de datos que acondiciona, amplifica y filtra las señales de los detectores, las convierte de analógicas a digitales y transmite los datos para la reconstrucción.",i:["Es el sistema que genera la alta tensión y controla exclusivamente el filamento del tubo.","Es el sistema mecánico que hace girar la mesa del paciente y regula su altura.","Es el programa que almacena las imágenes finales, sin intervenir en la adquisición de datos."]},
{q:"¿Qué es el tiempo de rotación en la TC?",a:"Es el tiempo necesario para que el conjunto tubo-detector complete una rotación alrededor del paciente.",i:["Es el tiempo que tarda el PACS en archivar una imagen.","Es el tiempo que necesita el paciente para entrar y salir de la sala.","Es el intervalo entre la impresión de dos imágenes consecutivas."]},
{q:"¿Cuál es la duración habitual del tiempo de rotación en una TC?",a:"Una rotación típica puede realizarse en aproximadamente un segundo o menos, según el equipo y el protocolo.",i:["Siempre dura exactamente diez segundos en todos los equipos de TC.","Siempre dura entre treinta y sesenta segundos, independientemente del protocolo.","Dura necesariamente cinco minutos para completar una rotación."]},
{q:"¿Qué es el pitch en una TC helicoidal?",a:"Es la relación entre el avance de la mesa durante una rotación y la anchura total del haz adquirido.",i:["Es la relación entre el tamaño del monitor y el número de imágenes almacenadas.","Es el cociente entre el kVp y la temperatura del tubo de rayos X.","Es la diferencia entre el brillo máximo y mínimo de la imagen reconstruida."]},
{q:"¿Qué determina el pitch en una TC?",a:"Influye en la velocidad de exploración, el muestreo, la calidad de imagen y la dosis, teniendo en cuenta el funcionamiento de los sistemas automáticos de modulación.",i:["Determina exclusivamente el tamaño físico del gantry, sin afectar a la adquisición.","Controla únicamente la temperatura de la sala y la velocidad del ventilador.","Determina solo el formato de archivo utilizado para guardar las imágenes."]},
{q:"¿Qué es el FOV en tomografía computarizada?",a:"FOV significa Field of View y es el campo de visión de la imagen reconstruida.",i:["Es el voltaje máximo que puede generar el tubo de rayos X.","Es el tiempo necesario para completar una rotación del gantry.","Es el número de filas de detectores instaladas en el equipo."]},
{q:"¿Cuál es la diferencia entre un píxel y un vóxel?",a:"El píxel es un elemento bidimensional de la imagen; el vóxel representa un volumen tridimensional que incluye las dimensiones del píxel y el espesor de corte.",i:["El píxel es un volumen tridimensional y el vóxel es un punto bidimensional sin espesor.","Ambos son exactamente lo mismo y solo se diferencian por el nombre del fabricante.","El píxel es un componente físico del tubo y el vóxel es una pieza del detector."]},
{q:"¿Qué hacen Window Width (WW) y Window Level (WL) en una imagen de TC?",a:"El Window Width determina la amplitud del intervalo de valores de atenuación que se muestra en escala de grises; el Window Level establece el centro de ese intervalo.",i:["El WW regula la corriente del tubo y el WL controla la velocidad de la mesa.","El WW determina el número de detectores y el WL controla la rotación del gantry.","El WW mide la dosis total y el WL indica el tiempo de exposición."]},
{q:"¿Qué es la anchura de intervalo en el ajuste de ventana de una TC?",a:"Es la amplitud de valores de atenuación, expresados en unidades Hounsfield, incluidos en la escala de grises; corresponde al Window Width.",i:["Es la distancia física entre el tubo de rayos X y el paciente.","Es el tiempo que transcurre entre dos rotaciones del gantry.","Es el número de filas de detectores utilizadas durante la adquisición."]},
{q:"¿Qué es la resolución espacial en una imagen de TC?",a:"Es la capacidad de distinguir estructuras pequeñas que se encuentran próximas entre sí.",i:["Es la capacidad de almacenar un gran número de imágenes en el PACS.","Es la capacidad de medir la temperatura del tubo durante la exploración.","Es la capacidad de aumentar el brillo de la imagen sin modificar otros parámetros."]},
{q:"¿Cuál es el objetivo al obtener una imagen de TC?",a:"Obtener una imagen con calidad suficiente para el propósito diagnóstico utilizando una exposición optimizada.",i:["Obtener siempre la imagen más brillante posible, aunque aumente innecesariamente la dosis.","Utilizar la máxima dosis disponible en todas las exploraciones para eliminar cualquier ruido.","Conseguir el mayor número de imágenes posible, independientemente de su utilidad diagnóstica."]},
{q:"¿Qué son los artefactos en una imagen de TC?",a:"Son alteraciones o patrones de la imagen que no representan fielmente la anatomía real y pueden relacionarse con el movimiento, los detectores, el endurecimiento del haz u otros factores.",i:["Son estructuras anatómicas normales que aparecen en todas las imágenes.","Son los datos digitales necesarios para que el PACS pueda almacenar las imágenes.","Son los valores de tensión y corriente seleccionados para el tubo de rayos X."]},
{q:"¿Cuáles son los principales tipos de artefactos en una TC?",a:"Entre los principales están los artefactos en anillo, los de movimiento, los debidos al endurecimiento del haz, los metálicos y los helicoidales.",i:["Artefactos acústicos, térmicos, ópticos, magnéticos y fotográficos exclusivamente.","Artefactos de impresión, de papel, de tinta, de pantalla y de archivo únicamente.","Artefactos de colimación, de consola, de teclado, de monitor y de mobiliario exclusivamente."]},
{q:"¿Qué función tiene el DAS en la adquisición de imágenes de TC?",a:"Recibe las señales analógicas procedentes de los detectores, las acondiciona, amplifica, filtra y digitaliza para transmitir los datos al sistema de reconstrucción.",i:["Genera los rayos X y los dirige hacia el paciente sin recibir señales de los detectores.","Controla únicamente el movimiento de la mesa y no procesa señales.","Almacena exclusivamente las imágenes finales y sustituye al sistema de reconstrucción."]},
{q:"¿Qué diferencia existe entre las señales analógicas y las digitales en la adquisición de imágenes de TC?",a:"La señal analógica procedente del detector es continua; tras la conversión analógico-digital, la información se representa mediante datos digitales que pueden procesarse y reconstruirse.",i:["La señal analógica solo aparece en el PACS y la digital solo en el tubo de rayos X.","La señal analógica es siempre una imagen impresa y la digital es una señal mecánica.","No existe diferencia, porque ambas son señales mecánicas que mueven el gantry."]},
{q:"¿Qué son las unidades Hounsfield (HU) y para qué se utilizan?",a:"Son unidades que expresan los valores de atenuación de los tejidos en la TC y permiten diferenciar estructuras según sus características de atenuación.",i:["Son unidades que miden la velocidad de rotación del gantry.","Son unidades que expresan la corriente del tubo en miliamperios.","Son unidades que miden la distancia entre las filas de detectores."]},
{q:"¿Qué diferencia hay entre CTDIvol y DLP?",a:"CTDIvol es un indicador de la salida de radiación del protocolo de TC y se expresa en mGy; DLP es el producto de CTDIvol por la longitud explorada y se expresa en mGy·cm.",i:["CTDIvol mide el tamaño del píxel en milímetros y DLP mide el número de detectores.","CTDIvol expresa el tiempo de rotación en segundos y DLP expresa el pitch.","CTDIvol mide el contraste de la imagen y DLP mide la resolución espacial."]},
{q:"¿Qué es la modulación automática de la corriente del tubo y de qué factores depende?",a:"Es un sistema que modifica la corriente del tubo durante la adquisición según factores como la anatomía, el tamaño del paciente, la posición angular, la región anatómica y la calidad seleccionada.",i:["Es un sistema que mantiene siempre la misma corriente, independientemente del paciente y del protocolo.","Es un sistema que modifica únicamente el tamaño del FOV según la temperatura de la sala.","Es un sistema que regula exclusivamente el almacenamiento de imágenes en el PACS."]},
{q:"¿Qué comprobaciones de mantenimiento preventivo y control de calidad se realizan en un equipo de TC?",a:"Se revisan aspectos mecánicos y de posicionamiento, el funcionamiento del gantry, la mesa, el generador y el tubo, la calibración y uniformidad de los detectores, y la exactitud de los números CT, el ruido y la resolución de imagen.",i:["Se comprueba únicamente que el monitor encienda y que el PACS esté conectado.","Se revisa solo el aspecto exterior de la mesa, sin comprobar el tubo ni los detectores.","Se comprueba exclusivamente la velocidad de impresión, sin evaluar la adquisición ni la calidad de imagen."]},
];

function mezclar(array) {
  const copia = [...array];

  for (let i = copia.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copia[i], copia[j]] = [copia[j], copia[i]];
  }

  return copia;
}

function actualizarContador() {
  contadorEl.textContent = `Aciertos: ${ok} | Fallos: ${fallos}`;
}

function actualizarBarra() {
  const pct = (respondidas / Math.max(1, juego.length)) * 100;
  barraGlobalEl.style.width = `${pct}%`;
}

function actualizarRacha() {
  if (racha > 0) {
    rachaEl.textContent = "¡Racha! " + "⭐".repeat(Math.min(racha, 5));
  } else {
    rachaEl.textContent = "";
  }
}

function renderProgress() {
  progressEl.innerHTML = "";

  for (let j = 0; j < juego.length; j++) {
    const sq = document.createElement("div");
    sq.className = "square";

    if (j < respondidas) {
      sq.classList.add(
        juego[j] && juego[j].acierto ? "ok" : "ko"
      );
    }

    progressEl.appendChild(sq);
  }
}

function mostrar() {
  if (i >= juego.length) {
    fin();
    return;
  }

  const preg = juego[i];
  const ops = mezclar([preg.a, ...preg.i]);

  app.innerHTML = `
    <div class="card">
      <h3>${i + 1}. ${preg.q}</h3>
      ${ops.map(op => `
        <button data-ans="${op}">${op}</button>
      `).join("")}
    </div>
  `;

  app.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => responder(btn.dataset.ans));
  });

  actualizarContador();
  renderProgress();
}

function responder(resp) {
  const preg = juego[i];
  const btns = app.querySelectorAll("button");
  const ok_resp = resp === preg.a;

  btns.forEach(btn => {
    btn.disabled = true;

    if (btn.dataset.ans === preg.a) {
      btn.classList.add("correct");
    }

    if (btn.dataset.ans === resp && !ok_resp) {
      btn.classList.add("incorrect");
    }
  });

  preg.acierto = ok_resp;

  if (ok_resp) {
    ok++;
    racha++;
  } else {
    fallos++;
    racha = 0;
  }

  respondidas = Math.min(i + 1, juego.length);

  actualizarContador();
  actualizarBarra();
  renderProgress();
  actualizarRacha();

  setTimeout(() => {
    i++;

    if (i < juego.length) {
      mostrar();
    } else {
      fin();
    }
  }, 800);
}

function fin() {
  const score = Math.round((ok / juego.length) * 100);

  const msg =
    score >= 70
      ? "¡Muy bien! 🎉"
      : score >= 50
        ? "Buen intento 👍"
        : "Sigue practicando 💪";

  app.innerHTML = `
    <div class="card resumen">
      <h2>🎯 Test terminado</h2>

      <div class="stat-box">
        <span>Respuestas correctas:</span>
        <strong>${ok} / ${juego.length}</strong>
      </div>

      <div class="stat-box">
        <span>Fallos:</span>
        <strong>${fallos}</strong>
      </div>

      <div class="stat-box">
        <span>Porcentaje:</span>
        <strong>${score}%</strong>
      </div>

      <div class="stat-box">
        <span>Resultado:</span>
        <strong>${msg}</strong>
      </div>

      <div class="button-group">
        <button id="resetBtn">🎮 Jugar otra vez</button>
      </div>
    </div>
  `;

  document.getElementById("resetBtn").addEventListener("click", iniciar);
  rachaEl.textContent = "";
}


function iniciar() {
  if (pendientes.length === 0) {
    pendientes = mezclar(preguntas);
  }

  juego = pendientes.splice(0, POR_PARTIDA);

  i = 0;
  ok = 0;
  fallos = 0;
  respondidas = 0;
  racha = 0;

  barraGlobalEl.style.width = "0%";
  rachaEl.textContent = "";

  actualizarContador();
  renderProgress();
  mostrar();
}


iniciar();
</script>

</html>
