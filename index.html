<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz Examen 1 Rehabilitación</title>
  <style>
    :root {
      --bg: #f3f5f7;
      --card: #ffffff;
      --primary: #007aff;
      --correct: #28a745;
      --wrong: #dc3545;
      --text: #1d1d1f;
      --muted: #666;
      --border: #dfe3e8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
    }

    h1 {
      text-align: center;
      margin: 0 0 18px;
      font-size: clamp(28px, 5vw, 42px);
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .barra-externa {
      width: 100%;
      height: 12px;
      background: #ddd;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 10px;
    }

    .barra-interna {
      height: 100%;
      width: 0%;
      background: var(--primary);
      transition: width 0.2s ease;
    }

    .stats {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .badge {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: bold;
      min-width: 110px;
      text-align: center;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.04);
      margin-bottom: 18px;
    }

    .pregunta-meta {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 12px;
      font-weight: bold;
    }

    .pregunta {
      font-size: clamp(18px, 3vw, 28px);
      line-height: 1.4;
      margin: 0 0 18px;
    }

    .opciones {
      display: grid;
      gap: 12px;
    }

    button {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.2s ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
      opacity: 0.95;
    }

    button:disabled {
      cursor: default;
      opacity: 1;
    }

    button.correct {
      background: var(--correct);
    }

    button.incorrect {
      background: var(--wrong);
    }

    .nombre-box {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      margin-bottom: 18px;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: 16px;
    }

    .result-box {
      text-align: center;
      padding: 18px;
    }

    .resultado-final {
      font-size: clamp(24px, 4vw, 40px);
      margin-bottom: 14px;
      font-weight: bold;
    }

    .racha {
      text-align: center;
      font-size: 20px;
      margin: 16px 0;
      font-weight: bold;
      min-height: 28px;
    }

    @media (max-width: 600px) {
      body { padding: 16px; }
      .nombre-box { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Dios nos pille confesados</h1>

    <div class="barra-externa">
      <div id="barraGlobal" class="barra-interna"></div>
    </div>

    <div class="topbar">
      <div class="stats">
        <div id="contador" class="badge">0 / 0</div>
        <div id="timer" class="badge">02:00</div>
      </div>
    </div>

    <div id="racha" class="racha"></div>
    <div id="app"></div>
  </div>

  <script>
    const app = document.getElementById('app');
    const contadorEl = document.getElementById('contador');
    const timerEl = document.getElementById('timer');
    const barraGlobalEl = document.getElementById('barraGlobal');
    const rachaEl = document.getElementById('racha');

    const TOTAL_SEGUNDOS = 120;
    const MAX_PREGUNTAS = 10;

    let preguntasJuego = [];
    let indiceActual = 0;
    let aciertos = 0;
    let tiempoRestante = TOTAL_SEGUNDOS;
    let timerId = null;
    let racha = 0;
    let jugador = localStorage.getItem('jugador') || '';

    const preguntas = [
      {
        q: '¿Cuál es la función de la fuente de alimentación en un sistema de rehabilitación?',
        options: [
          'Suministrar la energía necesaria para el funcionamiento del equipo',
          'Generar directamente la corriente terapéutica',
          'Medir la frecuencia cardíaca del paciente'
        ],
        correcta: 0
      },
      {
        q: '¿Cuál es la función principal del microcontrolador?',
        options: [
          'Gobernar el funcionamiento del equipo',
          'Producir la corriente terapéutica',
          'Actuar como electrodo'
        ],
        correcta: 0
      },
      {
        q: '¿Qué función tiene el generador de impulsos?',
        options: [
          'Producir la señal eléctrica que después se aplicará al paciente',
          'Amplificar la señal hasta su nivel final',
          'Controlar la temperatura del paciente'
        ],
        correcta: 0
      },
      {
        q: '¿Cuál es la función de la etapa de potencia?',
        options: [
          'Amplificar la señal para aplicarla al paciente',
          'Mostrar los menús al usuario',
          'Medir la presión arterial'
        ],
        correcta: 0
      },
      {
        q: '¿Qué protege al paciente frente a riesgos eléctricos?',
        options: [
          'El sistema de aislamiento eléctrico',
          'El electrodo',
          'La pantalla' 
        ],
        correcta: 0
      },
      {
        q: '¿Qué significa TENS?',
        options: [
          'Estimulación Nerviosa Eléctrica Transcutánea',
          'Tratamiento Eléctrico Neuromuscular Superficial',
          'Terapia Eléctrica de Nervios Segmentarios'
        ],
        correcta: 0
      },
      {
        q: '¿Qué finalidad tiene el TENS?',
        options: [
          'Disminuir la percepción del dolor',
          'Medir la glucosa',
          'Diagnosticar fracturas'
        ],
        correcta: 0
      },
      {
        q: '¿Qué equipo se usa principalmente para estimulación muscular?',
        options: [
          'EMS o electroestimulador muscular',
          'Osciloscopio',
          'Multímetro'
        ],
        correcta: 0
      },
      {
        q: '¿Qué tipo de corriente utiliza la iontoforesis?',
        options: [
          'Corriente continua',
          'Corriente alterna',
          'Corriente de alta frecuencia'
        ],
        correcta: 0
      },
      {
        q: '¿Qué es la finalidad de la iontoforesis?',
        options: [
          'Transportar medicamentos a través de la piel',
          'Generar calor corporal',
          'Medir la presión arterial'
        ],
        correcta: 0
      },
      {
        q: '¿Qué función tienen las corrientes rusas?',
        options: [
          'Estimular nervios motores y provocar contracciones',
          'Detectar enfermedades cardiacas',
          'Generar rayos X'
        ],
        correcta: 0
      },
      {
        q: '¿Qué pasa con la intensidad si se aumenta mucho en electroestimulación?',
        options: [
          'Puede producir irritación o quemaduras',
          'Se evita cualquier efecto',
          'Baja automáticamente la frecuencia cardíaca'
        ],
        correcta: 0
      }
    ];

    function shuffle(array) {
      const copia = [...array];
      for (let i = copia.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copia[i], copia[j]] = [copia[j], copia[i]];
      }
      return copia;
    }

    function formatearTiempo(segundos) {
      const m = String(Math.floor(segundos / 60)).padStart(2, '0');
      const s = String(segundos % 60).padStart(2, '0');
      return `${m}:${s}`;
    }

    function actualizarBarra() {
      const porcentaje = ((indiceActual + 1) / preguntasJuego.length) * 100;
      barraGlobalEl.style.width = `${porcentaje}%`;
    }

    function actualizarContador() {
      contadorEl.textContent = `${Math.min(indiceActual, preguntasJuego.length)} / ${preguntasJuego.length}`;
    }

    function actualizarRacha() {
      rachaEl.textContent = racha > 0 ? `Racha: ${racha}` : '';
    }

    function mostrarPantallaInicio() {
      app.innerHTML = `
        <div class="card result-box">
          <div style="margin-bottom: 12px; font-weight: bold;">Introduce tu nombre</div>
          <div class="nombre-box">
            <input id="nombreJugador" type="text" maxlength="18" value="${jugador}" placeholder="Tu nombre" />
            <button id="btnIniciar">Empezar</button>
          </div>
        </div>
      `;

      const input = document.getElementById('nombreJugador');
      const btn = document.getElementById('btnIniciar');
      btn.addEventListener('click', () => {
        const nombre = input.value.trim();
        if (!nombre) {
          input.focus();
          return;
        }
        jugador = nombre;
        localStorage.setItem('jugador', jugador);
        iniciarPartida();
      });

      input.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          btn.click();
        }
      });
    }

    function iniciarPartida() {
      preguntasJuego = shuffle(preguntas).slice(0, MAX_PREGUNTAS);
      indiceActual = 0;
      aciertos = 0;
      tiempoRestante = TOTAL_SEGUNDOS;
      racha = 0;
      timerEl.textContent = formatearTiempo(tiempoRestante);
      contadorEl.textContent = `0 / ${preguntasJuego.length}`;
      barraGlobalEl.style.width = '0%';
      actualizarRacha();
      mostrarPregunta();
      iniciarTemporizador();
    }

    function iniciarTemporizador() {
      clearInterval(timerId);
      timerId = setInterval(() => {
        tiempoRestante--;
        timerEl.textContent = formatearTiempo(tiempoRestante);

        if (tiempoRestante <= 0) {
          clearInterval(timerId);
          finalizarPartida();
        }
      }, 1000);
    }

    function mostrarPregunta() {
      const pregunta = preguntasJuego[indiceActual];
      if (!pregunta) {
        finalizarPartida();
        return;
      }

      contadorEl.textContent = `${indiceActual} / ${preguntasJuego.length}`;
      barraGlobalEl.style.width = `${((indiceActual) / preguntasJuego.length) * 100}%`;

      app.innerHTML = `
        <div class="card">
          <div class="pregunta-meta">Pregunta ${indiceActual + 1} de ${preguntasJuego.length}</div>
          <h2 class="pregunta">${pregunta.q}</h2>
          <div class="opciones">
            ${pregunta.options.map((opcion, index) => `
              <button class="respuesta-btn" data-index="${index}">${opcion}</button>
            `).join('')}
          </div>
        </div>
      `;

      document.querySelectorAll('.respuesta-btn').forEach((btn) => {
        btn.addEventListener('click', () => responder(Number(btn.dataset.index)));
      });
    }

    function responder(indexSeleccionado) {
      const pregunta = preguntasJuego[indiceActual];
      const botones = document.querySelectorAll('.respuesta-btn');

      botones.forEach((btn) => {
        btn.disabled = true;
        const valor = Number(btn.dataset.index);

        if (valor === pregunta.correcta) {
          btn.classList.add('correct');
        }

        if (valor === indexSeleccionado && valor !== pregunta.correcta) {
          btn.classList.add('incorrect');
        }
      });

      if (indexSeleccionado === pregunta.correcta) {
        aciertos++;
        racha++;
      } else {
        racha = 0;
      }

      actualizarRacha();

      setTimeout(() => {
        indiceActual++;

        if (indiceActual < preguntasJuego.length) {
          mostrarPregunta();
        } else {
          finalizarPartida();
        }
      }, 900);
    }

    function finalizarPartida() {
      clearInterval(timerId);
      const nota = Math.round((aciertos / preguntasJuego.length) * 100);

      app.innerHTML = `
        <div class="card result-box">
          <div>Jugador: <strong>${jugador}</strong></div>
          <div class="resultado-final">${aciertos}/${preguntasJuego.length}</div>
          <div style="font-size: 20px; margin-bottom: 16px;">Nota: ${nota}%</div>
          <button id="btnReiniciar">Jugar otra vez</button>
        </div>
      `;

      document.getElementById('btnReiniciar').addEventListener('click', mostrarPantallaInicio);
      contadorEl.textContent = `${preguntasJuego.length} / ${preguntasJuego.length}`;
      barraGlobalEl.style.width = '100%';
      timerEl.textContent = formatearTiempo(tiempoRestante);
      rachaEl.textContent = `Racha final: ${racha}`;
    }

    mostrarPantallaInicio();
  </script>
</body>
</html>
