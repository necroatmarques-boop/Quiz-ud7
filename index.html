function mezclar(array){
  const copia=[...array];
  for(let i=copia.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [copia[i],copia[j]]=[copia[j],copia[i]];
  }
  return copia;
}

function formatearTiempo(seg){
  const m=String(Math.floor(seg/60)).padStart(2,'0');
  const s=String(seg%60).padStart(2,'0');
  return `${m}:${s}`;
}

function actualizarBarra(){
  const pct=(ok/Math.max(1,juego.length))*100;
  barraGlobalEl.style.width=`${pct}%`;
}

function actualizarContador(){
  contadorEl.textContent=`${respondidas} / ${juego.length}`;
}

function actualizarRacha(){
  if(racha>0){
    rachaEl.textContent="¡Racha! "+"⭐".repeat(Math.min(racha,5));
  } else {
    rachaEl.textContent="";
  }
}

function renderProgress(){
  progressEl.innerHTML="";
  for(let j=0;j<POR_PARTIDA;j++){
    const sq=document.createElement("div");
    sq.className="square";
    if(j<respondidas){
      sq.classList.add(juego[j]&&juego[j].acierto?"ok":"ko");
    }
    progressEl.appendChild(sq);
  }
}

function empezar(){
  clearInterval(intervalo);
  intervalo=setInterval(()=>{
    tiempo--;
    timerEl.textContent=formatearTiempo(tiempo);
    if(tiempo<=0){
      clearInterval(intervalo);
      fin();
    }
  },1000);
}

function mostrar(){
  if(i>=juego.length){
    fin();
    return;
  }

  const preg=juego[i];
  const ops=mezclar([preg.a,...preg.i]);

  app.innerHTML=`
    <div class="card">
      <h3>${i+1}. ${preg.q}</h3>
      ${ops.map(op=>`<button data-ans="${op}">${op}</button>`).join("")}
    </div>
  `;

  app.querySelectorAll("button").forEach(btn=>{
    btn.addEventListener("click",()=>responder(btn.dataset.ans));
  });

  actualizarContador();
  renderProgress();
}

function responder(resp){
  const preg=juego[i];
  const btns=app.querySelectorAll("button");
  const ok_resp=resp===preg.a;

  btns.forEach(btn=>{
    btn.disabled=true;
    if(btn.dataset.ans===preg.a) btn.classList.add("correct");
    if(btn.dataset.ans===resp && !ok_resp) btn.classList.add("incorrect");
  });

  juego[i].acierto=ok_resp;

  if(ok_resp){
    ok++;
    racha++;
  } else {
    racha=0;
  }

  respondidas=Math.min(i+1,juego.length);
  actualizarContador();
  actualizarBarra();
  renderProgress();
  actualizarRacha();

  setTimeout(()=>{
    i++;
    if(i<juego.length){
      mostrar();
    } else {
      fin();
    }
  },800);
}

function fin(){
  clearInterval(intervalo);
  const score=Math.round((ok/juego.length)*100);
  const msg=score>=70?"¡Muy bien! 🎉":score>=50?"Buen intento 👍":"Sigue practicando 💪";
  const tiempoUsado=formatearTiempo(TIEMPO_TOTAL-tiempo);

  app.innerHTML=`
    <div class="card resumen">
      <h2>🎯 Fin de la partida</h2>
      
      <div class="stat-box">
        <span>Jugador:</span>
        <strong>${jugador}</strong>
      </div>
      <div class="stat-box">
        <span>Respuestas correctas:</span>
        <strong>${ok} / ${juego.length}</strong>
      </div>
      <div class="stat-box">
        <span>Porcentaje:</span>
        <strong>${score}%</strong>
      </div>
      <div class="stat-box">
        <span>Tiempo usado:</span>
        <strong>${tiempoUsado}</strong>
      </div>
      <div class="stat-box">
        <span>Resultado:</span>
        <strong>${msg}</strong>
      </div>

      <div class="button-group">
        <button id="resetBtn">🎮 Jugar otra vez</button>
        <button id="cambiarNombreBtn">👤 Otro jugador</button>
      </div>
    </div>
  `;

  document.getElementById("resetBtn").addEventListener("click",iniciar);
  document.getElementById("cambiarNombreBtn").addEventListener("click",()=>{
    const nuevoNombre=prompt("¿Cuál es tu nombre?",jugador);
    if(nuevoNombre&&nuevoNombre.trim()){
      jugador=nuevoNombre.trim();
      localStorage.setItem("jugador",jugador);
      iniciar();
    }
  });

  rachaEl.textContent="";
}

function iniciar(){
  juego=mezclar(preguntas).slice(0,POR_PARTIDA);
  i=0;
  ok=0;
  respondidas=0;
  tiempo=TIEMPO_TOTAL;
  racha=0;
  timerEl.textContent=formatearTiempo(tiempo);
  barraGlobalEl.style.width="0%";
  rachaEl.textContent="";
  empezar();
  mostrar();
}

const nombreIngresado=prompt("¿Cuál es tu nombre?",jugador);
if(nombreIngresado&&nombreIngresado.trim()){
  jugador=nombreIngresado.trim();
}
localStorage.setItem("jugador",jugador);
iniciar();

</script>
