{q:"¿Qué es un laboratorio clínico?",a:"Es un establecimiento sanitario donde se realizan análisis de muestras biológicas, como sangre, orina o tejidos, para ayudar en el diagnóstico, seguimiento y prevención de enfermedades.",i:["Es un establecimiento dedicado exclusivamente a fabricar medicamentos.","Es un centro donde se realizan únicamente operaciones quirúrgicas.","Es un lugar destinado solo a almacenar muestras biológicas."]},

{q:"¿Quién trabaja en un laboratorio clínico?",a:"Técnicos de laboratorio, bioquímicos, médicos y otros profesionales especializados.",i:["Únicamente enfermeros y cirujanos.","Solo administrativos y personal de limpieza.","Exclusivamente farmacéuticos."]},
{q:"¿Qué tecnología utiliza un laboratorio clínico?",a:"Equipos avanzados y protocolos estrictos de calidad y seguridad para garantizar resultados fiables.",i:["Únicamente herramientas manuales sin controles de calidad.","Solo ordenadores para registrar pacientes.","Equipos destinados exclusivamente a realizar radiografías."]},
{q:"¿Qué tipos de laboratorios clínicos hay?",a:"Laboratorios de bioquímica clínica, hematología, microbiología, inmunología, genética y anatomía patológica.",i:["Laboratorios de cirugía, traumatología y fisioterapia exclusivamente.","Laboratorios de radiología, odontología y cardiología únicamente.","Laboratorios de farmacia, nutrición y rehabilitación exclusivamente."]},

{q:"¿Cómo se clasifican por función los laboratorios?",a:"En laboratorios de bioquímica clínica, hematología, microbiología, inmunología, genética y biología molecular, y anatomía patológica.",i:["En laboratorios públicos, privados y universitarios.","En laboratorios pequeños, medianos y grandes.","En laboratorios de cirugía, enfermería y fisioterapia."]},
{q:"¿Qué funciones, ejemplos y equipos tiene el laboratorio de bioquímica clínica?",a:"Funciones: analiza componentes químicos en sangre, orina y otros fluidos. Ejemplos: glucosa, colesterol y enzimas hepáticas. Equipos: analizadores bioquímicos automáticos, centrífugas y espectrofotómetros.",i:["Funciones: estudia células sanguíneas. Ejemplos: hemogramas y coagulación. Equipos: contadores hematológicos.","Funciones: detecta microorganismos patógenos. Ejemplos: cultivos y antibiogramas. Equipos: estufas de cultivo y microscopios.","Funciones: estudia tejidos y células. Ejemplos: biopsias y citologías. Equipos: micrótomos y criostatos."]},
{q:"¿Qué es un laboratorio de bioquímica clínica?",a:"Es el laboratorio que analiza los componentes químicos de la sangre, la orina y otros fluidos del organismo.",i:["Es el laboratorio que estudia exclusivamente los microorganismos patógenos.","Es el laboratorio que estudia únicamente las células sanguíneas.","Es el laboratorio que analiza exclusivamente tejidos mediante biopsias."]},

{q:"¿Qué funciones, ejemplos y equipos tiene el laboratorio de hematología?",a:"Funciones: estudia las células sanguíneas. Ejemplos: hemogramas y coagulación. Equipos: contadores hematológicos y analizadores de coagulación.",i:["Funciones: analiza glucosa y colesterol. Ejemplos: enzimas hepáticas. Equipos: espectrofotómetros y centrífugas.","Funciones: detecta microorganismos. Ejemplos: cultivos y antibiogramas. Equipos: estufas de cultivo y campanas de flujo laminar.","Funciones: estudia tejidos y células. Ejemplos: biopsias y citologías. Equipos: micrótomos y microscopios ópticos."]},

{q:"¿Qué funciones, ejemplos y equipos tiene el laboratorio de microbiología?",a:"Funciones: detecta microorganismos patógenos, como bacterias, virus y hongos. Ejemplos: cultivos y antibiogramas. Equipos: estufas de cultivo, campanas de flujo laminar y microscopios.",i:["Funciones: analiza componentes químicos. Ejemplos: glucosa y colesterol. Equipos: analizadores bioquímicos y centrífugas.","Funciones: estudia células sanguíneas. Ejemplos: hemogramas y coagulación. Equipos: contadores hematológicos.","Funciones: estudia el sistema inmunológico. Ejemplos: pruebas de anticuerpos. Equipos: analizadores de inmunoensayo."]},

{q:"¿Qué funciones, ejemplos y equipos tiene el laboratorio de inmunología?",a:"Funciones: estudia el sistema inmunológico y sus respuestas. Ejemplos: pruebas de anticuerpos y autoinmunidad. Equipos: ELISA y analizadores de inmunoensayo.",i:["Funciones: estudia el ADN y el ARN. Ejemplos: PCR y secuenciación genética. Equipos: termocicladores y secuenciadores.","Funciones: detecta microorganismos. Ejemplos: cultivos y antibiogramas. Equipos: estufas de cultivo y microscopios.","Funciones: estudia células sanguíneas. Ejemplos: hemogramas. Equipos: contadores hematológicos."]},

{q:"¿Qué funciones, ejemplos y equipos tiene el laboratorio de genética y biología molecular?",a:"Funciones: analiza ADN, ARN y mutaciones genéticas. Ejemplos: PCR y secuenciación genética. Equipos: termocicladores, secuenciadores y cabinas de PCR.",i:["Funciones: estudia el sistema inmunológico. Ejemplos: pruebas de anticuerpos. Equipos: ELISA y analizadores de inmunoensayo.","Funciones: analiza componentes químicos. Ejemplos: glucosa y colesterol. Equipos: espectrofotómetros y centrífugas.","Funciones: estudia tejidos y células. Ejemplos: biopsias y citologías. Equipos: micrótomos y criostatos."]},
{q:"¿Qué es un laboratorio de anatomía patológica?",a:"Es el laboratorio que estudia tejidos y células para el diagnóstico de enfermedades.",i:["Es el laboratorio que estudia exclusivamente las células sanguíneas.","Es el laboratorio que analiza únicamente anticuerpos y alergias.","Es el laboratorio que analiza exclusivamente glucosa y colesterol."]},
{q:"¿Qué funciones, ejemplos y equipos tiene el laboratorio de anatomía patológica?",a:"Funciones: estudia tejidos y células para el diagnóstico de enfermedades. Ejemplos: biopsias y citologías. Equipos: micrótomos, criostatos y microscopios ópticos.",i:["Funciones: analiza ADN y ARN. Ejemplos: PCR y secuenciación genética. Equipos: termocicladores y secuenciadores.","Funciones: detecta microorganismos. Ejemplos: cultivos y antibiogramas. Equipos: estufas de cultivo y campanas de flujo laminar.","Funciones: estudia células sanguíneas. Ejemplos: hemogramas y coagulación. Equipos: contadores hematológicos y analizadores de coagulación."]},
{q:"¿Qué analiza el laboratorio de bioquímica clínica?",a:"Analiza los componentes químicos de la sangre, la orina y otros fluidos del organismo.",i:["Estudia las células sanguíneas y la coagulación.","Detecta microorganismos patógenos mediante cultivos.","Estudia las alteraciones de los tejidos mediante biopsias."]},
{q:"¿Qué células estudia el laboratorio de hematología?",a:"Estudia los glóbulos rojos, los glóbulos blancos y las plaquetas.",i:["Las células de los tejidos exclusivamente.","Las bacterias, los virus y los hongos.","Las células del sistema inmunológico exclusivamente."]},
{q:"¿Qué estudia la inmunología?",a:"Estudia la inmunidad biológica y sus aplicaciones.",i:["Estudia la estructura química de los seres vivos exclusivamente.","Estudia las alteraciones de los tejidos producidas por enfermedades.","Estudia únicamente la coagulación sanguínea."]},
{q:"¿Qué estudia la biología molecular?",a:"Estudia los fenómenos biológicos desde el punto de vista de la estructura molecular.",i:["Estudia exclusivamente las células sanguíneas.","Estudia únicamente los microorganismos visibles a simple vista.","Estudia las propiedades físicas de los órganos exclusivamente."]},
{q:"¿Qué estudia la anatomía patológica?",a:"Estudia las alteraciones producidas por las enfermedades en las células y los tejidos de los seres vivos.",i:["Estudia los componentes químicos de la sangre y la orina.","Estudia exclusivamente los anticuerpos y las alergias.","Estudia el ADN y el ARN mediante secuenciación genética."]},
{q:"¿Qué ejemplos de análisis se realizan en el laboratorio de bioquímica clínica?",a:"Análisis de glucosa, colesterol y enzimas hepáticas.",i:["Hemogramas, coagulación y morfología celular.","Cultivos, antibiogramas y detección de microorganismos.","Biopsias, citologías y estudio de tejidos."]},

{q:"¿Qué pruebas se realizan en el laboratorio de genética y biología molecular?",a:"PCR y secuenciación genética.",i:["Hemogramas y pruebas de coagulación.","Cultivos y antibiogramas.","Análisis de glucosa y colesterol."], {q:"¿Qué ejemplos de pruebas se realizan en el laboratorio de hematología?",a:"Hemogramas y pruebas de coagulación.",i:["Glucosa, colesterol y enzimas hepáticas.","PCR y secuenciación genética.","Biopsias y citologías."]},
{q:"¿Qué ejemplos de pruebas se realizan en el laboratorio de microbiología?",a:"Cultivos y antibiogramas.",i:["Hemogramas y pruebas de coagulación.","Pruebas de anticuerpos y autoinmunidad.","Análisis de glucosa y colesterol."]},
{q:"¿Qué ejemplos de pruebas se realizan en el laboratorio de inmunología?",a:"Pruebas de anticuerpos y autoinmunidad.",i:["Biopsias y citologías.","Hemogramas y coagulación.","PCR y secuenciación genética."]},
{q:"¿Qué equipos se utilizan en el laboratorio de bioquímica clínica?",a:"Analizadores bioquímicos automáticos, centrífugas y espectrofotómetros.",i:["Estufas de cultivo, campanas de flujo laminar y microscopios.","Contadores hematológicos y analizadores de coagulación.","Micrótomos, criostatos y microscopios ópticos."]},
{q:"¿Qué equipos se utilizan en el laboratorio de hematología?",a:"Contadores hematológicos y analizadores de coagulación.",i:["Termocicladores, secuenciadores y cabinas de PCR.","Analizadores bioquímicos automáticos y espectrofotómetros.","Estufas de cultivo y campanas de flujo laminar."]},
{q:"¿Qué equipos se utilizan en el laboratorio de inmunología?",a:"ELISA y analizadores de inmunoensayo.",i:["Micrótomos, criostatos y microscopios ópticos.","Contadores hematológicos y analizadores de coagulación.","Termocicladores y secuenciadores genéticos."]},
{q:"¿Qué equipos se utilizan en el laboratorio de genética y biología molecular?",a:"Termocicladores, secuenciadores y cabinas de PCR.",i:["Analizadores bioquímicos automáticos, centrífugas y espectrofotómetros.","Estufas de cultivo, campanas de flujo laminar y microscopios.","Contadores hematológicos y analizadores de coagulación."]},
{q:"¿Qué equipos se utilizan en el laboratorio de anatomía patológica?",a:"Micrótomos, criostatos y microscopios ópticos.",i:["Termocicladores, secuenciadores y cabinas de PCR.","Analizadores bioquímicos automáticos y espectrofotómetros.","Estufas de cultivo y analizadores de inmunoensayo."]},

{q:"¿Dónde deben situarse las zonas para comer, beber y utilizar los aseos?",a:"Fuera del espacio de trabajo del laboratorio básico.",i:["Dentro de las zonas donde se manipulan muestras.","Junto a los espacios de almacenamiento de productos químicos.","En cualquier lugar disponible dentro del laboratorio."]},
{q:"¿Dónde debe guardarse la ropa exterior y los artículos personales del personal?",a:"En espacios dispuestos específicamente para depositar y guardar los artículos personales, prendas exteriores y batas limpias.",i:["En las encimeras de trabajo junto a las muestras.","En los pasillos y salidas de emergencia.","En los armarios destinados a sustancias químicas peligrosas."]},
{q:"¿Cómo debe organizarse el almacenamiento de materiales fungibles y reactivos?",a:"Debe disponerse de espacio o estanterías suficientes para almacenarlos de forma segura a corto y largo plazo.",i:["Deben colocarse siempre sobre las mesas de trabajo.","Deben almacenarse en los pasillos para facilitar su acceso.","Deben guardarse exclusivamente en frigoríficos."]},
{q:"¿Dónde deben almacenarse los suministros que no son de uso inmediato?",a:"En espacios de almacenamiento adecuados, con el almacenamiento de larga duración fuera del laboratorio.",i:["En las mesas de trabajo y los pasillos.","Junto a las salidas de emergencia.","En cualquier superficie libre del laboratorio."]},
{q:"¿Qué medidas pueden adoptarse para proteger los materiales fungibles y los reactivos?",a:"Medidas de control de plagas, en función de las circunstancias locales.",i:["Eliminar todos los sistemas de ventilación.","Mantener abiertos los armarios de almacenamiento.","Guardar todos los reactivos junto a los residuos."]},
{q:"¿Cómo deben almacenarse los productos químicos peligrosos?",a:"En armarios de almacenamiento especializados para sustancias como productos inflamables, oxidantes o corrosivos.",i:["En estanterías abiertas junto a las muestras biológicas.","En cualquier armario sin tener en cuenta sus propiedades.","En los pasillos para facilitar su transporte."]},
{q:"¿Qué suministros de emergencia deben preverse en el laboratorio?",a:"Soluciones para el lavado de ojos, material de primeros auxilios y equipos para derrames biológicos o químicos.",i:["Únicamente material de oficina y equipos informáticos.","Solo reactivos de uso diario y material fungible.","Exclusivamente mobiliario de reserva."]},
{q:"¿Qué aspectos deben preverse para el almacenamiento de muestras?",a:"Espacio suficiente en frigoríficos y congeladores, suministro eléctrico, recuperación ante interrupciones, vigilancia de la temperatura, alarmas y seguridad física.",i:["Únicamente estanterías abiertas y etiquetas identificativas.","Solo la temperatura ambiental de la sala.","Exclusivamente el número de muestras que se reciben cada día."]},
{q:"¿Qué debe preverse para almacenar los desechos antes de eliminarlos?",a:"Espacio suficiente para almacenarlos en condiciones de seguridad antes de descontaminarlos o transportarlos para su eliminación.",i:["Almacenamiento junto a las muestras sin separación.","Espacio en los pasillos y salidas de emergencia.","Almacenamiento sin tener en cuenta la descontaminación."]},
{q:"¿Cómo debe organizarse la ubicación de los desechos y de las unidades de descontaminación?",a:"De forma que el olor y el calor excesivo generados no afecten a otras zonas ni al personal del laboratorio.",i:["Junto a las zonas de descanso del personal.","En cualquier espacio disponible, sin considerar sus efectos.","En las entradas principales del laboratorio."]},
{q:"¿Qué debe garantizarse antes de la eliminación final de residuos sensibles o infecciosos?",a:"La separación necesaria de residuos, el almacenamiento seguro y la custodia antes de su descontaminación, destrucción o eliminación final.",i:["Únicamente su traslado inmediato a una zona común.","Su mezcla con todos los residuos del laboratorio.","Su almacenamiento sin medidas de seguridad."]},
{q:"¿Cómo deben ser las paredes y los suelos del laboratorio?",a:"Deben ser superficies lisas y continuas, fáciles de limpiar, impermeables y resistentes a los productos químicos y desinfectantes utilizados.",i:["Deben tener superficies porosas y absorbentes.","Deben estar recubiertos de materiales textiles.","Deben utilizar materiales que dificulten la limpieza."]},
{q:"¿Por qué deben sellarse las juntas de las baldosas?",a:"Para evitar que la suciedad y otros contaminantes se acumulen en la lechada y las juntas.",i:["Para aumentar la absorción de líquidos.","Para impedir el acceso a los equipos de laboratorio.","Para evitar la necesidad de limpiar el suelo."]},
{q:"¿Qué características deben tener los suelos del laboratorio?",a:"Deben soportar el peso del mobiliario, los equipos y el personal, y ser antideslizantes en la medida de lo posible.",i:["Deben ser absorbentes y flexibles.","Deben estar cubiertos de alfombras.","Deben facilitar la acumulación de líquidos."]},
{q:"¿Qué medidas deben adoptarse en los desagües del suelo?",a:"Deben incluir rejillas o trampas de agua para impedir la entrada de insectos, roedores u otros animales.",i:["Deben permanecer abiertos para facilitar el drenaje.","Deben utilizarse para almacenar residuos sólidos.","Deben carecer de cualquier sistema de protección."]},
{q:"¿Cómo deben ser las ventanas de un laboratorio?",a:"Normalmente deben estar selladas, aunque pueden ser practicables cuando el laboratorio esté diseñado para la ventilación natural.",i:["Deben permanecer siempre abiertas.","Deben carecer de mecanismos de cierre.","Deben permitir la entrada de insectos para favorecer la ventilación."]},
{q:"¿Qué debe evitarse al diseñar la ventilación natural?",a:"Los movimientos y las corrientes fuertes de aire que puedan interferir con el correcto funcionamiento del equipo.",i:["La entrada de luz natural.","La utilización de equipos especializados.","La existencia de ventanas accesibles."]},
{q:"¿Qué características deben tener las puertas del laboratorio básico?",a:"Deben poder cerrarse con pestillo, disponer de un visor y tener anchura suficiente para el paso de equipos, materiales y desechos.",i:["Deben permanecer abiertas y carecer de ventanas.","Deben ser estrechas para limitar la circulación.","Deben carecer de señalización."]},
{q:"¿Qué información mínima debe incluir la señalización de las puertas?",a:"Símbolos internacionales de peligro biológico donde corresponda, datos de contacto del responsable en caso de emergencia e indicación de acceso restringido.",i:["Únicamente el nombre del edificio y el horario de apertura.","Solo el nombre de los trabajadores de cada turno.","Exclusivamente el número de equipos de la sala."]},
{q:"¿Qué características debe tener el mobiliario del laboratorio?",a:"Debe ser fácil de limpiar, adecuado en tamaño y función y suficientemente robusto para soportar el uso previsto.",i:["Debe tener superficies textiles absorbentes.","Debe ser difícil de mover para impedir su limpieza.","Debe estar fabricado exclusivamente con madera sin sellar."]},
{q:"¿Por qué no deben utilizarse muebles con superficies textiles absorbentes?",a:"Porque pueden absorber y retener contaminantes.",i:["Porque aumentan la iluminación del laboratorio.","Porque impiden que funcionen los equipos eléctricos.","Porque dificultan la identificación de las muestras mediante etiquetas."]},
{q:"¿Qué ventaja tienen los muebles con ruedas bloqueables?",a:"Pueden trasladarse fácilmente y permiten acceder a las zonas para limpiarlas o descontaminarlas.",i:["Evitan la necesidad de realizar mantenimiento.","Permiten almacenar residuos en cualquier lugar.","Eliminan la necesidad de utilizar productos desinfectantes."]},
{q:"¿Por qué se recomienda el mobiliario ergonómico?",a:"Porque ofrece comodidad durante el trabajo y puede ayudar a reducir la posibilidad de incidentes o accidentes.",i:["Porque permite eliminar los protocolos de seguridad.","Porque evita la necesidad de formar al personal.","Porque sustituye a los equipos de protección personal."]},
{q:"¿Qué materiales deben evitarse en cortinas, persianas y suelos del laboratorio?",a:"Las superficies absorbentes, las alfombras, los tapetes y las losetas textiles.",i:["Los materiales impermeables y fáciles de limpiar.","Los materiales resistentes a los productos químicos.","Las superficies lisas y continuas."]},
{q:"¿Qué características deben tener las encimeras de trabajo?",a:"Deben ser impermeables al agua y resistentes al calor, los productos químicos y los desinfectantes utilizados en el laboratorio.",i:["Deben ser porosas y absorber los líquidos.","Deben estar fabricadas exclusivamente con materiales textiles.","Deben deteriorarse al entrar en contacto con desinfectantes."]},
{q:"¿Cuándo son aceptables las encimeras de madera, baldosas, metal, hormigón o pintadas?",a:"Cuando están debidamente selladas, pueden limpiarse con facilidad y resisten los productos químicos utilizados.",i:["Cuando no tienen ningún recubrimiento protector.","Cuando absorben los productos químicos.","Cuando no pueden limpiarse con desinfectantes."]},
{q:"¿Cómo deben ser los bordes de las encimeras cuando sea posible?",a:"Curvos, para facilitar la limpieza.",i:["Afilados, para evitar el contacto con las superficies.","Porosos, para absorber los derrames.","Textiles, para reducir el ruido."]},
{q:"¿Dónde deben instalarse las instalaciones para el lavado de manos?",a:"En cada sala del laboratorio donde se realicen procedimientos, incluida la manipulación de desechos, y lo más cerca posible de la puerta de salida.",i:["Únicamente en la entrada principal del edificio.","Solo en las zonas destinadas a comer y beber.","Dentro de los armarios de almacenamiento de reactivos."]},
{q:"¿Cómo deben organizarse los lavamanos del laboratorio?",a:"Deben dedicarse exclusivamente al lavado de manos y estar separados de los fregaderos utilizados para productos químicos o líquidos contaminados.",i:["Deben utilizarse para lavar manos, material químico y muestras indistintamente.","Deben instalarse dentro de las zonas de almacenamiento de residuos.","Deben compartir siempre el mismo espacio con los fregaderos de productos químicos."]},
{q:"¿Qué tipo de mecanismo para obtener agua se recomienda en los lavamanos?",a:"Un mecanismo de manos libres, accionado con el codo, la muñeca, la rodilla o el pie.",i:["Un mecanismo que solo pueda accionarse con las manos contaminadas.","Un sistema sin agua corriente.","Un sistema que requiera tocar superficies contaminadas para funcionar."]},
{q:"¿Qué características debe tener el suministro eléctrico del laboratorio?",a:"Debe tener capacidad y fiabilidad suficientes para el funcionamiento seguro y eficaz de todos los dispositivos eléctricos y electrónicos.",i:["Debe funcionar sin conexión a tierra.","Debe ser inestable para reducir el consumo.","Debe alimentar únicamente los equipos de iluminación."]},
{q:"¿Para qué sirve la conexión a tierra de las tomas eléctricas?",a:"Para evitar descargas en caso de mal funcionamiento.",i:["Para aumentar la temperatura de las muestras.","Para eliminar la necesidad de fusibles.","Para reducir la iluminación de emergencia."]},
{q:"¿Qué sistemas pueden instalarse para reducir los picos de tensión y las interrupciones eléctricas?",a:"Sistemas de alimentación ininterrumpida o estabilizadores de corriente.",i:["Sistemas de ventilación natural y campanas extractoras.","Sistemas de almacenamiento de muestras y residuos.","Sistemas de iluminación decorativa."]},
{q:"¿Qué puede necesitar un laboratorio donde se producen cortes eléctricos frecuentes?",a:"Un generador de electricidad.",i:["Un sistema de almacenamiento de productos químicos inflamables junto a las tomas.","Un sistema de ventilación sin suministro eléctrico.","Un sistema de iluminación exclusivamente natural."]},
{q:"¿Dónde deben colocarse los suministros eléctricos?",a:"Lejos de las zonas de procesos húmedos y de acuerdo con los requisitos locales de seguridad eléctrica.",i:["Junto a los fregaderos y las zonas de derrames.","Dentro de las zonas de descontaminación líquida.","Debajo de las superficies donde se manipulan líquidos."]},
{q:"¿Qué requisitos debe cumplir la iluminación del laboratorio?",a:"Debe ser adecuada para todas las actividades, evitando sombras, reflejos y deslumbramientos.",i:["Debe ser idéntica en todas las zonas sin considerar los procedimientos.","Debe evitar la luz artificial en cualquier circunstancia.","Debe producir sombras para delimitar las áreas de trabajo."]},
{q:"¿Qué debe garantizar la iluminación de emergencia?",a:"Una salida segura del laboratorio y, si la situación lo permite, la contención del trabajo que se esté realizando.",i:["La continuidad de todos los experimentos sin importar el riesgo.","Únicamente la iluminación de los almacenes.","Solo el funcionamiento de los equipos informáticos."]},
{q:"¿Para qué sirven los controles ambientales del laboratorio?",a:"Para controlar la temperatura y la humedad y proporcionar un ambiente cómodo donde el personal pueda trabajar de forma segura y eficiente.",i:["Para sustituir las medidas de bioseguridad.","Para eliminar la necesidad de limpieza y descontaminación.","Para aumentar las corrientes de aire cerca de las superficies de trabajo."]},
{q:"¿Qué debe evitarse al instalar sistemas de refrigeración, calefacción y ventilación?",a:"Corrientes de aire o turbulencias indebidas cerca de las superficies de trabajo.",i:["El control de la temperatura y la humedad.","La instalación de equipos de seguridad.","La disponibilidad de iluminación adecuada."]},
{q:"¿De qué depende la selección de los sistemas de seguridad del laboratorio?",a:"De la evaluación de las necesidades y de la reglamentación oficial o normativa de construcción aplicable.",i:["Únicamente del número de muestras recibidas diariamente.","Exclusivamente del presupuesto para mobiliario.","Del tipo de decoración de las instalaciones."]},
{q:"¿Qué sistemas de seguridad deben preverse en el laboratorio?",a:"Sistemas de seguridad contra incendios, incluidas las alarmas correspondientes, y para los gases de laboratorio cuando proceda.",i:["Únicamente sistemas de control de temperatura.","Solo sistemas de almacenamiento de reactivos.","Exclusivamente sistemas informáticos de registro."]},
{q:"¿Cuándo debe estudiarse el espacio necesario para los equipos de laboratorio y sus suministros?",a:"Durante las primeras etapas del diseño del laboratorio.",i:["Después de finalizar la construcción y comenzar todos los procedimientos.","Únicamente cuando se produzca una avería.","Después de retirar todos los equipos de las instalaciones."]},
{q:"¿Qué suministros pueden necesitar los equipos de laboratorio?",a:"Agua, electricidad, gas, desagües y teléfonos.",i:["Únicamente agua y mobiliario de oficina.","Solo electricidad e iluminación natural.","Exclusivamente sistemas de calefacción."]},
{q:"¿Qué espacios deben preverse para los equipos de laboratorio?",a:"Espacio suficiente para utilizarlos con seguridad, limpiarlos, descontaminarlos, mantenerlos y trasladarlos hasta las instalaciones o retirarlos de ellas.",i:["Solo espacio para su funcionamiento habitual.","Únicamente espacio para almacenarlos cuando estén averiados.","Espacio limitado que impida el acceso para mantenimiento."]},
{q:"¿Qué debe hacerse antes de incorporar un equipo al diseño del laboratorio?",a:"Seguir las instrucciones del fabricante para ubicarlo y garantizar que pueda manejarse con seguridad.",i:["Instalarlo en cualquier espacio disponible sin revisar sus requisitos.","Desconectar los sistemas de seguridad del equipo.","Ignorar las necesidades de suministro eléctrico y ventilación."]},
{q:"¿Qué debe preverse cuando los equipos generan mucho calor o flujos de aire importantes?",a:"Sistemas suplementarios para facilitar el enfriamiento o la evacuación del calor y una ubicación que tenga en cuenta los equipos y procedimientos sensibles a las corrientes de aire.",i:["Únicamente más espacio de almacenamiento de residuos.","La eliminación de los sistemas de ventilación.","La instalación de todos los equipos juntos para concentrar el calor."]},
{q:"¿Cómo deben seleccionarse las medidas de control reforzadas?",a:"Según una evaluación del riesgo y las pruebas disponibles sobre su eficacia, teniendo en cuenta los riesgos concretos que se deben reducir.",i:["Aplicando siempre las mismas medidas a todos los laboratorios.","Seleccionándolas exclusivamente por su precio.","Eligiéndolas sin considerar los agentes biológicos ni los procedimientos."]},
{q:"¿Qué debe hacerse cuando no existe información fiable sobre la eficacia de una medida de control reforzada?",a:"Puede ser necesario realizar una validación interna de las medidas de control de riesgos.",i:["Aplicar la medida sin comprobar su eficacia.","Eliminar todas las medidas de control existentes.","Sustituir la evaluación del riesgo por una estimación económica."]},
{q:"¿Qué información puede utilizarse para valorar las medidas de control reforzadas?",a:"Nuevos datos, incidentes previos y la eficacia de las medidas de control de riesgos.",i:["Únicamente el número de trabajadores del laboratorio.","Solo el coste del mobiliario y de las instalaciones.","Exclusivamente la antigüedad del edificio."]},
{q:"¿Qué debe hacerse después de aplicar una medida de control reforzada?",a:"Volver a evaluar el riesgo residual y determinar si se ha reducido hasta un nivel aceptable.",i:["Dar por finalizada la evaluación del riesgo sin comprobar los resultados.","Eliminar las medidas de control que se hayan aplicado.","Aumentar la actividad sin revisar las condiciones de seguridad."]},
{q:"¿Cómo deben seleccionarse las medidas de control reforzadas según el párrafo de la página 30?",a:"Con arreglo a una evaluación del riesgo y a las pruebas disponibles sobre su eficacia, procedentes de estudios revisados externamente u otras fuentes fiables.",i:["Según las preferencias personales del personal del laboratorio.","Únicamente según el coste de los equipos.","Sin consultar datos ni fuentes de información."]},
{q:"¿Qué se debe hacer con el riesgo residual después de aplicar una medida de control?",a:"Volver a evaluarlo para determinar si la medida seleccionada lo ha convertido en un riesgo aceptable.",i:["Considerarlo siempre aceptable sin realizar comprobaciones.","Ignorarlo si se han instalado equipos nuevos.","Eliminar el registro de la evaluación inicial."]},
{q:"¿Cuándo pueden necesitarse instalaciones con medidas de máxima contención?",a:"En circunstancias excepcionales, cuando se deben controlar los riesgos más altos asociados a agentes biológicos con consecuencias graves y una elevada probabilidad de exposición o liberación.",i:["En todas las actividades de laboratorio, independientemente del riesgo.","Únicamente cuando se realizan análisis bioquímicos rutinarios.","Cuando se quiere reducir el coste de construcción del laboratorio."]},
{q:"¿Qué aspectos deben tenerse en cuenta antes de construir un laboratorio de máxima contención?",a:"Sus elevados costes de planificación, diseño, construcción, operación y mantenimiento; las autorizaciones especiales; y la disponibilidad de personal capacitado y experimentado.",i:["Únicamente el espacio necesario para instalar los equipos.","Solo el número de muestras que se analizarán al día.","Exclusivamente la ubicación de las zonas de descanso."]},
{q:"¿Qué alternativas deben considerarse antes de construir un laboratorio de máxima contención?",a:"Utilizar otro agente biológico o procedimiento cuando sea posible, o subcontratar las tareas a otro establecimiento apropiado.",i:["Eliminar las evaluaciones del riesgo y comenzar la construcción.","Reducir el personal capacitado para disminuir los costes.","Utilizar instalaciones sin autorización ni supervisión."]},
{q:"¿Cuáles son las fases típicas de un proyecto de construcción, renovación o readaptación de un laboratorio?",a:"Idea o necesidades de la instalación, planificación, diseño, construcción, puesta en marcha, funcionamiento y mantenimiento.",i:["Diseño, funcionamiento y cierre, sin planificación previa.","Compra de equipos, contratación y apertura, exclusivamente.","Construcción, almacenamiento y eliminación de muestras."]},
{q:"¿Qué aspectos requieren especial atención durante un proyecto de laboratorio?",a:"Los presupuestos, el personal y los horarios.",i:["La decoración, los uniformes y los turnos de comida.","Únicamente el número de puertas y ventanas.","Solo los equipos informáticos y las zonas de descanso."]},
{q:"¿En qué se basa la planificación, configuración y definición de los requisitos de diseño de un laboratorio?",a:"En la evaluación del riesgo y la evaluación de las necesidades.",i:["Únicamente en el presupuesto disponible.","Solo en las preferencias del equipo de construcción.","Exclusivamente en la cantidad de mobiliario."]},
{q:"¿Qué debe hacerse antes de comenzar la construcción, readaptación o renovación de un laboratorio?",a:"Realizar una evaluación pormenorizada de los riesgos y una evaluación de las necesidades específicas del establecimiento.",i:["Comprar todos los equipos antes de identificar los riesgos.","Comenzar las obras sin definir las necesidades.","Seleccionar el mobiliario sin establecer medidas de control."]},
{q:"¿En qué dos partes puede dividirse la planificación de un laboratorio?",a:"En la fase previa a la planificación y la fase de planificación propiamente dicha.",i:["En la fase de construcción y la fase de demolición.","En la fase de almacenamiento y la fase de análisis.","En la fase de mantenimiento y la fase de cierre exclusivamente."]},
{q:"¿Qué comprende la fase previa a la planificación?",a:"La idea inicial, la determinación de las necesidades en el nivel directivo y el acuerdo para avanzar en una dirección concreta.",i:["La instalación definitiva de todos los equipos.","La puesta en marcha de los procedimientos de laboratorio.","La reparación de averías y el mantenimiento correctivo."]},
{q:"¿Cuál es la actividad principal de la fase de planificación?",a:"Reunir a un equipo de expertos competentes que realice una evaluación del riesgo y una evaluación de las necesidades.",i:["Contratar únicamente al personal de limpieza.","Seleccionar los colores y acabados del laboratorio.","Comenzar la construcción antes de definir los requisitos."]},
{q:"¿Qué determina la evaluación del riesgo durante la planificación?",a:"La necesidad de medidas de control de riesgos y si son suficientes los requisitos básicos o se necesitan medidas reforzadas o de máxima contención.",i:["Únicamente el coste del proyecto.","Solo la cantidad de equipos informáticos.","Exclusivamente la distribución de los despachos."]},
{q:"¿Qué determina la evaluación de las necesidades?",a:"La naturaleza y el propósito del laboratorio, los detalles del trabajo que se realizará y los equipos necesarios.",i:["Solo el presupuesto para mobiliario.","Únicamente los horarios del personal.","Exclusivamente los materiales de construcción."]},
{q:"¿Qué debe determinarse durante la fase de planificación en relación con el proyecto?",a:"Costos realistas y entregas fundamentales que apoyen los objetivos del proyecto y sirvan como marcadores de progreso.",i:["Solo el color de las paredes y el mobiliario.","Únicamente la cantidad de muestras almacenadas.","Exclusivamente la ubicación de las zonas de descanso."]},
{q:"¿Qué documentos se elaboran a partir de la lista completa de necesidades del laboratorio durante la fase de diseño?",a:"Un resumen de los requisitos del usuario y, a continuación, una especificación de los requisitos del usuario.",i:["Un inventario de muestras y un registro de pacientes exclusivamente.","Un calendario de vacaciones y un listado de turnos.","Un informe de averías y un registro de limpieza únicamente."]},
{q:"¿Qué fases aparecen en el diagrama del proyecto de diseño de la página 55?",a:"Diseño conceptual, diseño esquemático y diseño detallado, con revisiones y aprobaciones antes de avanzar.",i:["Almacenamiento, descontaminación y eliminación de residuos.","Evaluación del riesgo, análisis clínico y entrega de resultados.","Mantenimiento preventivo, reparación y cierre del laboratorio."]},
{q:"¿Qué sucede si el diseño conceptual, esquemático o detallado no recibe la aprobación necesaria?",a:"Se revisa y ajusta el diseño; si el resultado es inaceptable, puede detenerse el proceso.",i:["Se avanza automáticamente a la construcción sin modificaciones.","Se elimina la evaluación de las necesidades.","Se inicia la fase operacional sin revisar el diseño."]},
{q:"¿Qué contribuye a la bioseguridad en el laboratorio durante la fase operacional?",a:"El buen funcionamiento de los equipos y sistemas de laboratorio.",i:["La reducción de las inspecciones de los equipos.","El almacenamiento de materiales en los pasillos.","La eliminación de los procedimientos operativos normalizados."]},
{q:"¿Cuáles son los dos tipos de mantenimiento de equipos y sistemas de laboratorio?",a:"Mantenimiento planificado y mantenimiento no planificado.",i:["Mantenimiento químico y mantenimiento biológico.","Mantenimiento interno y mantenimiento externo exclusivamente.","Mantenimiento inicial y mantenimiento de construcción."]},
{q:"¿Qué tipos de mantenimiento planificado existen?",a:"Mantenimiento predictivo y mantenimiento preventivo.",i:["Mantenimiento de emergencia y mantenimiento correctivo.","Mantenimiento de construcción y mantenimiento de demolición.","Mantenimiento químico y mantenimiento eléctrico exclusivamente."]},
{q:"¿Cómo se denomina también el mantenimiento no planificado?",a:"Mantenimiento por avería o de emergencia, también llamado mantenimiento correctivo.",i:["Mantenimiento predictivo exclusivamente.","Mantenimiento preventivo y programado.","Mantenimiento de diseño conceptual."]},
{q:"¿Qué actividades aparecen en el diagrama de la fase operacional de la página 71?",a:"Elegir las opciones de mantenimiento, establecer equipos o contratar personal competente, elaborar un plan de mantenimiento, formar al personal, redactar PON, supervisar el funcionamiento y evaluar periódicamente el programa.",i:["Comprar equipos sin establecer un plan de mantenimiento.","Realizar únicamente la limpieza y eliminar los registros de inspección.","Construir nuevas instalaciones sin formar al personal."]},
{q:"¿Qué debe hacerse después de redactar los procedimientos operativos normalizados (PON)?",a:"Proporcionar formación y prácticas sobre los PON.",i:["Retirarlos de las instalaciones para evitar su consulta.","Sustituirlos por instrucciones verbales no documentadas.","Suspender la formación del personal."]},
{q:"¿Qué debe supervisarse constantemente durante la fase operacional?",a:"El funcionamiento y las medidas de control del riesgo.",i:["Únicamente el coste de los reactivos.","Solo los horarios de entrada del personal.","Exclusivamente el número de muestras recibidas."]},

];

function mezclar(array) {
  const copia = [...array];

  for (let i = copia.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copia[i], copia[j]] = [copia[j], copia[i]];
  }

  return copia;
}

function actualizarContador() {
  contadorEl.textContent = `Aciertos: ${ok} | Fallos: ${fallos}`;
}

function actualizarBarra() {
  const pct = (respondidas / Math.max(1, juego.length)) * 100;
  barraGlobalEl.style.width = `${pct}%`;
}

function actualizarRacha() {
  if (racha > 0) {
    rachaEl.textContent = "¡Racha! " + "⭐".repeat(Math.min(racha, 5));
  } else {
    rachaEl.textContent = "";
  }
}

function renderProgress() {
  progressEl.innerHTML = "";

  for (let j = 0; j < juego.length; j++) {
    const sq = document.createElement("div");
    sq.className = "square";

    if (j < respondidas) {
      sq.classList.add(
        juego[j] && juego[j].acierto ? "ok" : "ko"
      );
    }

    progressEl.appendChild(sq);
  }
}

function mostrar() {
  if (i >= juego.length) {
    fin();
    return;
  }

  const preg = juego[i];
  const ops = mezclar([preg.a, ...preg.i]);

  app.innerHTML = `
    <div class="card">
      <h3>${i + 1}. ${preg.q}</h3>
      ${ops.map(op => `
        <button data-ans="${op}">${op}</button>
      `).join("")}
    </div>
  `;

  app.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => responder(btn.dataset.ans));
  });

  actualizarContador();
  renderProgress();
}

function responder(resp) {
  const preg = juego[i];
  const btns = app.querySelectorAll("button");
  const ok_resp = resp === preg.a;

  btns.forEach(btn => {
    btn.disabled = true;

    if (btn.dataset.ans === preg.a) {
      btn.classList.add("correct");
    }

    if (btn.dataset.ans === resp && !ok_resp) {
      btn.classList.add("incorrect");
    }
  });

  preg.acierto = ok_resp;

  if (ok_resp) {
    ok++;
    racha++;
  } else {
    fallos++;
    racha = 0;
  }

  respondidas = Math.min(i + 1, juego.length);

  actualizarContador();
  actualizarBarra();
  renderProgress();
  actualizarRacha();

  setTimeout(() => {
    i++;

    if (i < juego.length) {
      mostrar();
    } else {
      fin();
    }
  }, 800);
}

function fin() {
  const score = Math.round((ok / juego.length) * 100);

  const msg =
    score >= 70
      ? "¡Muy bien! 🎉"
      : score >= 50
        ? "Buen intento 👍"
        : "Sigue practicando 💪";

  app.innerHTML = `
    <div class="card resumen">
      <h2>🎯 Test terminado</h2>

      <div class="stat-box">
        <span>Respuestas correctas:</span>
        <strong>${ok} / ${juego.length}</strong>
      </div>

      <div class="stat-box">
        <span>Fallos:</span>
        <strong>${fallos}</strong>
      </div>

      <div class="stat-box">
        <span>Porcentaje:</span>
        <strong>${score}%</strong>
      </div>

      <div class="stat-box">
        <span>Resultado:</span>
        <strong>${msg}</strong>
      </div>

      <div class="button-group">
        <button id="resetBtn">🎮 Jugar otra vez</button>
      </div>
    </div>
  `;

  document.getElementById("resetBtn").addEventListener("click", iniciar);
  rachaEl.textContent = "";
}


function iniciar() {
  if (pendientes.length === 0) {
    pendientes = mezclar(preguntas);
  }

  juego = pendientes.splice(0, POR_PARTIDA);

  i = 0;
  ok = 0;
  fallos = 0;
  respondidas = 0;
  racha = 0;

  barraGlobalEl.style.width = "0%";
  rachaEl.textContent = "";

  actualizarContador();
  renderProgress();
  mostrar();
}


iniciar();
</script>
